<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetDash Atlas — Network Map</title>
<style>
:root{
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Cantarell", "Helvetica Neue", Arial, sans-serif;
}
:root[data-theme="dark"]{
  --bg:#080c11; --panel:rgba(16,21,27,.92); --panel-solid:#10151b; --panel2:#151b23; --hover:#1a222b;
  --border:#222c37; --grid:rgba(103,232,249,.05); --grid-major:rgba(103,232,249,.09);
  --text:#e2e9f0; --muted:#8093a5; --accent:#67e8f9; --on-acc:#06232a;
  --green:#4ade80; --amber:#fbbf24; --red:#f87171; --blue:#7dd3fc;
  --link:rgba(103,232,249,.34); --link-hot:rgba(103,232,249,.75);
  --term-bg:#080c10; --term-fg:#7ee0a3; --shadow:0 12px 34px rgba(0,0,0,.55);
  --glass:rgba(10,14,18,.72);
}
:root[data-theme="light"]{
  --bg:#eef1f5; --panel:rgba(255,255,255,.93); --panel-solid:#ffffff; --panel2:#f5f7fa; --hover:#eaeef3;
  --border:#d5dde6; --grid:rgba(14,116,144,.06); --grid-major:rgba(14,116,144,.12);
  --text:#16212c; --muted:#5c6d7e; --accent:#0e7490; --on-acc:#ffffff;
  --green:#16a34a; --amber:#d97706; --red:#e11d48; --blue:#0284c7;
  --link:rgba(14,116,144,.4); --link-hot:rgba(14,116,144,.8);
  --term-bg:#0d1117; --term-fg:#7ee787; --shadow:0 12px 34px rgba(22,33,44,.16);
  --glass:rgba(244,247,250,.78);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;letter-spacing:.005em;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.hidden{display:none!important}

#map{position:fixed;inset:0;display:block;cursor:grab;touch-action:none}
#map.dragging{cursor:grabbing}
#map.pointing{cursor:pointer}

.hud{position:fixed;z-index:10}
.topbar{top:0;left:0;right:0;display:flex;align-items:center;gap:14px;padding:11px 18px;background:var(--glass);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:680;font-size:15px;letter-spacing:-.01em}
.brand .logo{width:26px;height:26px;border-radius:7px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:750;font-family:var(--mono)}
.viewtabs{display:flex;gap:3px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:3px}
.viewtab{padding:5px 14px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted);transition:background .12s,color .12s}
.viewtab:hover{color:var(--text)}
.viewtab.active{background:var(--panel-solid);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.status-pill{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green);font-size:12.5px;font-weight:650}
.status-pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 7px currentColor;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:600;font-family:var(--mono)}
.live .pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 7px var(--accent);animation:pulse 1.6s ease-in-out infinite}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:32px;height:32px;border-radius:7px;border:1px solid var(--border);background:var(--panel2);display:grid;place-items:center;color:var(--muted);transition:color .12s,border-color .12s}
.icon-btn:hover{color:var(--text);border-color:var(--muted)}
.icon-btn.has-badge{position:relative}
.icon-btn .nbadge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px;min-width:16px;text-align:center}
.searchbtn{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:7px 12px;color:var(--muted);min-width:220px;text-align:left;font-size:13px;transition:border-color .12s}
.searchbtn:hover{border-color:var(--muted);color:var(--text)}
.searchbtn kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 5px}

.legend{left:18px;bottom:18px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 15px;backdrop-filter:blur(10px);min-width:172px}
.legend h4{margin:0 0 9px;font-size:12px;font-weight:650;color:var(--muted)}
.legend .row{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:3px 0;color:var(--muted)}
.legend .row b{color:var(--text);font-weight:600;margin-left:auto;font-family:var(--mono);font-size:11.5px}
.legend .ln{width:22px;height:0;border-top:2px solid var(--link);flex:none}
.legend .ln.warn{border-top-style:dashed;border-color:var(--amber)}
.legend .ln.off{border-top-style:dotted;border-color:var(--muted);opacity:.5}
.legend .sz{border-radius:50%;background:color-mix(in srgb,var(--accent) 30%,transparent);border:1.5px solid var(--accent);flex:none}
.legend .dotc{width:10px;height:10px;border-radius:50%;flex:none}
.legend .dotc.on{background:var(--green)} .legend .dotc.warning{background:var(--amber)}
.legend .dotc.offline{background:transparent;border:2px solid var(--muted)} .legend .dotc.blocked{background:var(--muted)}

.mapctl{right:18px;bottom:18px;display:flex;flex-direction:column;gap:7px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:7px;backdrop-filter:blur(10px)}
.mapctl button{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;color:var(--muted);font-size:16px;font-weight:600;transition:background .12s,color .12s}
.mapctl button:hover{background:var(--hover);color:var(--text)}
.mapctl .sep{height:1px;background:var(--border);margin:1px 3px}

.stats-strip{top:64px;left:50%;transform:translateX(-50%);display:flex;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;backdrop-filter:blur(10px)}
.stats-strip .seg{background:var(--panel-solid);padding:9px 18px;display:flex;flex-direction:column;gap:2px;min-width:118px;text-align:left;transition:background .12s}
.stats-strip button.seg:hover{background:var(--hover)}
.stats-strip .sl{font-size:11px;color:var(--muted);font-weight:600}
.stats-strip .sv{font-family:var(--mono);font-size:16px;font-weight:640;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats-strip .sv .u{font-size:11px;color:var(--muted);font-weight:550;margin-left:3px}
.stats-strip .sv.ok{color:var(--green)} .stats-strip .sv.warn{color:var(--amber)}

.tooltip{position:fixed;z-index:30;pointer-events:none;background:var(--panel-solid);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);padding:10px 13px;min-width:190px;display:none}
.tooltip .tt-name{font-weight:650;font-size:13.5px;display:flex;align-items:center;gap:8px}
.tooltip .tt-name .dot{width:8px;height:8px;border-radius:50%}
.tooltip .tt-grid{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:7px;font-size:12px}
.tooltip .tt-grid span:nth-child(odd){color:var(--muted)}
.tooltip .tt-grid span:nth-child(even){text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.tooltip .tt-hint{margin-top:7px;padding-top:6px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}

.drawer{position:fixed;top:0;right:0;bottom:0;width:374px;z-index:20;background:var(--panel-solid);border-left:1px solid var(--border);box-shadow:var(--shadow);transform:translateX(102%);transition:transform .22s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;overflow:hidden}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.dr-head{padding:16px 18px 13px;border-bottom:1px solid var(--border);display:flex;gap:13px;align-items:flex-start}
.dr-badge{width:42px;height:42px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted);flex:none}
.dr-badge svg{width:21px;height:21px}
.dr-head h2{margin:0;font-size:17px;font-weight:680;letter-spacing:-.015em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.dr-meta{color:var(--muted);font-size:12.5px;margin-top:3px}
.dr-close{margin-left:auto;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted);font-size:16px;flex:none}
.dr-close:hover{background:var(--hover);color:var(--text)}
.pill{font-size:11px;font-weight:650;padding:3px 9px;border-radius:20px}
.pill.on,.pill.online{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.pill.warning{background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber)}
.pill.offline,.pill.blocked{background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
.dr-tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--border)}
.dr-tab{padding:11px 13px;font-weight:600;color:var(--muted);font-size:13px;border-bottom:2px solid transparent;transition:color .12s}
.dr-tab:hover{color:var(--text)}
.dr-tab.active{color:var(--text);border-bottom-color:var(--accent)}
.dr-body{flex:1;overflow:auto;padding:16px 18px 24px}
.dr-actions{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap;background:var(--panel2)}
.btn{padding:7px 14px;border-radius:7px;border:1px solid var(--border);background:var(--panel-solid);font-weight:600;font-size:13px;color:var(--text);transition:border-color .12s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-acc)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent);background:color-mix(in srgb,var(--red) 8%,transparent)}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.fact{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
.fact .fl{font-size:11.5px;color:var(--muted);font-weight:550}
.fact .fv{font-size:15.5px;font-weight:660;margin-top:3px;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.subcard{border:1px solid var(--border);border-radius:9px;padding:13px 14px;background:var(--panel2);margin-bottom:12px}
.subcard h4{margin:0 0 11px;font-size:12.5px;font-weight:650;color:var(--muted)}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:baseline}
dl.kv dt{color:var(--muted);font-size:12.5px}
dl.kv dd{margin:0;font-size:13px;font-weight:550;text-align:right;font-family:var(--mono);font-size:12.5px}
.chart-block{border:1px solid var(--border);border-radius:9px;padding:11px 11px 5px;background:var(--panel2);margin-bottom:12px}
.chart-block .cb-head{display:flex;align-items:center;font-size:12.5px;font-weight:650;padding:0 4px 7px}
.chart-block .cb-head .right{margin-left:auto;color:var(--muted);font-weight:500;font-size:11.5px;font-family:var(--mono)}
.chart-block canvas{width:100%;height:120px;display:block}
.term{background:var(--term-bg);color:var(--term-fg);border:1px solid var(--border);border-radius:9px;font-family:var(--mono);font-size:12px;padding:12px 14px;min-height:150px;max-height:230px;overflow:auto;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
.term .muted-line{color:#7d8b9c}
.term .warn-line{color:#f5b942}
.term .cmd{color:#79c0ff}
.diag-bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.note{font-size:12px;color:var(--muted);line-height:1.5}

.alerts-panel{position:fixed;top:56px;right:14px;width:340px;max-height:70vh;z-index:25;background:var(--panel-solid);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.alerts-panel .ap-head{padding:12px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;font-weight:650;font-size:13.5px}
.alerts-panel .ap-list{overflow:auto;padding:6px}
.alert-item{display:flex;gap:10px;width:100%;text-align:left;padding:9px 11px;border-radius:8px;align-items:flex-start;transition:background .1s}
.alert-item:hover{background:var(--hover)}
.alert-item .sev{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.alert-item.critical .sev{background:var(--red)} .alert-item.warning .sev{background:var(--amber)} .alert-item.info .sev{background:var(--blue)}
.alert-item .msg{font-size:13px;line-height:1.45}
.alert-item .meta{font-size:11px;color:var(--muted);margin-top:2px;font-family:var(--mono)}
.empty{padding:24px 14px;text-align:center;color:var(--muted);font-size:13px}
.sw-wrap{padding:5px 12px}
.sw-row{display:flex;align-items:center;gap:11px;padding:9px 4px;font-size:13.5px;cursor:pointer}
.switch{position:relative;display:inline-block;width:36px;height:20px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .track{position:absolute;inset:0;background:var(--border);border-radius:20px;transition:.16s}
.switch .knob{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:.16s}
.switch input:checked + .track{background:color-mix(in srgb,var(--accent) 55%,transparent)}
.switch input:checked + .track + .knob{left:19px;background:var(--accent)}

.cmdk{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;display:grid;place-items:start center;padding-top:12vh}
.cmdk-box{background:var(--panel-solid);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);width:min(560px,92vw);overflow:hidden}
.cmdk-box input{width:100%;padding:15px 17px;background:none;border:none;outline:none;font-size:15px;border-bottom:1px solid var(--border);color:var(--text)}
.cmdk-list{max-height:320px;overflow:auto;padding:6px}
.cmdk-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:8px;transition:background .1s}
.cmdk-item:hover,.cmdk-item.sel{background:var(--hover)}
.cmdk-item .ci-name{font-weight:620;font-size:13.5px}
.cmdk-item .ci-meta{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.cmdk-item .ci-right{margin-left:auto;font-size:12px;color:var(--muted)}

#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:9px;z-index:90;align-items:center}
.toast{background:var(--panel-solid);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:9px;box-shadow:var(--shadow);padding:11px 15px;font-size:13.5px;max-width:360px;animation:tin .18s ease-out}
.toast.err{border-left-color:var(--red)} .toast.warn{border-left-color:var(--amber)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:80}
.modal{background:var(--panel-solid);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);width:min(430px,92vw);padding:20px}
.modal h3{margin:0 0 8px;font-size:16.5px;font-weight:680;letter-spacing:-.015em}
.modal p{margin:0 0 18px;color:var(--muted);font-size:13.5px;line-height:1.55}
.modal .m-actions{display:flex;gap:9px;justify-content:flex-end}

@media (max-width:900px){
  .stats-strip{display:none}
  .searchbtn{min-width:0;width:40px}.searchbtn span,.searchbtn kbd{display:none}
  .viewtabs{display:none}
  .drawer{width:100%}
  .legend{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<canvas id="map"></canvas>

<header class="hud topbar">
  <div class="brand"><span class="logo">N</span><span>Atlas</span></div>
  <nav class="viewtabs">
    <button class="viewtab active" data-open="map">Map</button>
    <button class="viewtab" data-open="list">Devices</button>
    <button class="viewtab" data-open="settings">Settings</button>
  </nav>
  <div class="status-pill"><span class="dot"></span>Internet online</div>
  <div class="top-right">
    <button class="searchbtn" data-action="open-cmdk"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><span>Find device…</span><kbd>Ctrl K</kbd></button>
    <span class="live"><span class="pulse"></span>LIVE</span>
    <button class="icon-btn has-badge" id="alertsBtn" title="Alerts"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.8a4.2 4.2 0 0 0-4.2 4.2c0 3.4-1.4 4.4-1.4 4.4h11.2s-1.4-1-1.4-4.4A4.2 4.2 0 0 0 8 1.8Z"/><path d="M6.6 13a1.5 1.5 0 0 0 2.8 0"/></svg><span class="nbadge" id="alertBadge" style="display:none">0</span></button>
    <button class="icon-btn" id="themeBtn" title="Toggle theme"></button>
  </div>
</header>

<div class="hud stats-strip" id="statsStrip">
  <div class="seg"><span class="sl">Latency</span><span class="sv" id="mLat">14<span class="u">ms</span></span></div>
  <div class="seg"><span class="sl">Download</span><span class="sv ok" id="mDown">0<span class="u">Mb/s</span></span></div>
  <div class="seg"><span class="sl">Upload</span><span class="sv" id="mUp" style="color:var(--blue)">0<span class="u">Mb/s</span></span></div>
  <button class="seg" data-action="open-list"><span class="sl">Devices</span><span class="sv" id="mDev">0/0</span></button>
  <button class="seg" data-action="open-alerts"><span class="sl">Alerts</span><span class="sv warn" id="mAlerts">0</span></button>
</div>

<aside class="hud legend">
  <h4>Map legend</h4>
  <div class="row"><span class="dotc on"></span>Connected<b id="lgOn">0</b></div>
  <div class="row"><span class="dotc warning"></span>Warning<b id="lgWarn">0</b></div>
  <div class="row"><span class="dotc offline"></span>Offline<b id="lgOff">0</b></div>
  <div class="row"><span class="dotc blocked"></span>Blocked<b id="lgBlk">0</b></div>
  <div class="row" style="margin-top:7px;padding-top:8px;border-top:1px solid var(--border)"><span class="ln"></span>Active link</div>
  <div class="row"><span class="ln warn"></span>Degraded</div>
  <div class="row"><span class="ln off"></span>Idle / down</div>
  <div class="row"><span class="sz" style="width:14px;height:14px"></span>Size = traffic</div>
</aside>

<div class="hud mapctl">
  <button data-action="zoom-in" title="Zoom in">+</button>
  <button data-action="zoom-out" title="Zoom out">−</button>
  <div class="sep"></div>
  <button data-action="fit" title="Fit to view" style="font-size:13px">⤢</button>
  <button data-action="recenter" title="Recenter gateway" style="font-size:13px">◎</button>
</div>

<div class="tooltip" id="tooltip"></div>

<aside class="drawer" id="drawer">
  <div class="dr-head">
    <div class="dr-badge" id="drBadge"></div>
    <div style="min-width:0">
      <h2 id="drName">Device <span class="pill on" id="drPill">Connected</span></h2>
      <div class="dr-meta" id="drMeta"></div>
    </div>
    <button class="dr-close" data-action="close-drawer" title="Close">✕</button>
  </div>
  <div class="dr-tabs">
    <button class="dr-tab active" data-dtab="overview">Overview</button>
    <button class="dr-tab" data-dtab="traffic">Traffic</button>
    <button class="dr-tab" data-dtab="troubleshoot">Troubleshoot</button>
  </div>
  <div class="dr-body" id="drBody"></div>
  <div class="dr-actions" id="drActions"></div>
</aside>

<div class="alerts-panel hidden" id="alertsPanel">
  <div class="ap-head"><span id="apTitle">Alerts</span> <span class="mono" style="color:var(--muted);font-weight:500" id="apCount"></span>
    <button class="dr-close" style="margin-left:auto" data-action="close-alerts">✕</button></div>
  <div class="ap-list" id="apList"></div>
</div>

<div id="cmdk" class="cmdk hidden">
  <div class="cmdk-box">

const layout = new Map();

  devices.forEach(d => groups[d.conn].push(d));
  const GOLD = 2.39996322973;
  Object.keys(groups).forEach((conn, gi) => {

/* ---------- simulation ---------- */

/* ---------- HUD ---------- */
function updateHud() {
  const c = counts(), un = unreadAlerts();
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.innerHTML = v; };
  set('mLat', Math.round(state.latency) + '<span class="u">ms</span>');
  set('mDown', fmtM(sumDown()) + '<span class="u">Mb/s</span>');
  set('mUp', fmtM(sumUp()) + '<span class="u">Mb/s</span>');
  set('mDev', (c.total - c.offline) + '/' + c.total);
  set('mAlerts', String(un));
  const badge = $('#alertBadge');
  badge.style.display = un ? '' : 'none'; badge.textContent = un;
  const lg = {lgOn:c.online, lgWarn:c.warning, lgOff:c.offline, lgBlk:c.blocked};
  Object.keys(lg).forEach(k => set(k, String(lg[k])));
  if (state.panel === 'alerts') renderPanel();
}

/* ---------- toast / modal ---------- */
function toast(msg, kind) {
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function confirmModal(title, body, okLabel, danger, onOk) {
  const root = $('#modalRoot');
  root.innerHTML = '<div class="modal-back"><div class="modal">' +
    '<h3>' + esc(title) + '</h3><p>' + esc(body) + '</p>' +
    '<div class="m-actions"><button class="btn" data-m="cancel">Cancel</button>' +
    '<button class="btn ' + (danger ? 'danger' : 'primary') + '" data-m="ok">' + esc(okLabel) + '</button></div></div></div>';
  root.querySelector('[data-m="cancel"]').onclick = () => root.innerHTML = '';
  root.querySelector('[data-m="ok"]').onclick = () => { root.innerHTML = ''; onOk(); };
  root.querySelector('.modal-back').onclick = e => { if (e.target === e.currentTarget) root.innerHTML = ''; };
}
function copyText(v) {
  const done = () => toast('Copied ' + v);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(done, fallback);
  else fallback();
  function fallback() {
    const ta = document.createElement('textarea'); ta.value = v; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed', 'err'); }
    ta.remove();
  }
}

/* ---------- tooltip ---------- */
const tip = $('#tooltip');
function showTooltip(d, sx, sy) {
  const st = displayState(d);
  tip.innerHTML = '<div class="tt-name"><span class="dot" style="background:' + cssVar(stateColor(st)) + '"></span>' + esc(d.name) + '</div>' +
    '<div class="tt-grid">' +
    '<span>Status</span><span>' + (st === 'online' ? 'Connected' : st.charAt(0).toUpperCase()+st.slice(1)) + '</span>' +
    '<span>IP</span><span>' + d.ip + '</span>' +
    '<span>Link</span><span>' + (d.conn === 'eth' ? 'Ethernet' : d.signal + ' dBm') + '</span>' +
    '<span>Traffic</span><span>↓ ' + fmtM(d.down) + ' ↑ ' + fmtM(d.up) + '</span></div>' +
    '<div class="tt-hint">Click for details</div>';
  tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = clamp(sx + 16, 8, W - w - 8) + 'px';
  tip.style.top = clamp(sy + 16, 64, H - h - 8) + 'px';
}
const hideTooltip = () => { tip.style.display = 'none'; };

/* ---------- pointer interaction ---------- */
let panning = false, dragMoved = false, lastX = 0, lastY = 0, downX = 0, downY = 0;
function hitTest(sx, sy) {
  for (let i = devices.length - 1; i >= 0; i--) {
    const d = devices[i], p = layout.get(d.id); if (!p) continue;
    const [x, y] = w2s(p.x, p.y);
    const r = nodeR(d) * clamp(cam.scale, 0.65, 1.35) + 6;
    if ((sx - x) ** 2 + (sy - y) ** 2 <= r * r) return d;
  }
  const [gx, gy] = w2s(gateway.x, gateway.y);
  if ((sx - gx) ** 2 + (sy - gy) ** 2 <= (30 * cam.scale + 10) ** 2) return 'gw';
  return null;
}
canvas.addEventListener('pointerdown', e => {
  panning = true; dragMoved = false;
  lastX = downX = e.clientX; lastY = downY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', e => {
  if (panning) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 5) { dragMoved = true; hideTooltip(); }
    cam.x -= dx / cam.scale; cam.y -= dy / cam.scale;
    lastX = e.clientX; lastY = e.clientY;
    return;
  }
  const hit = hitTest(e.clientX, e.clientY);
  const id = hit && hit !== 'gw' ? hit.id : null;
  if (id !== state.hoverId) state.hoverId = id;
  canvas.classList.toggle('pointing', !!hit);
  if (hit && hit !== 'gw') showTooltip(hit, e.clientX, e.clientY);
  else if (hit === 'gw') { tip.style.display = 'none'; }
  else hideTooltip();
});
canvas.addEventListener('pointerup', e => {
  panning = false; canvas.classList.remove('dragging');
  if (dragMoved) return;
  const hit = hitTest(e.clientX, e.clientY);
  if (hit && hit !== 'gw') openDrawer(hit.id);
  else if (hit === 'gw') toast('Gateway 192.168.1.1 · uptime 12d · firmware v4.2.1');
  else closeDrawer();
});
canvas.addEventListener('pointerleave', () => { hideTooltip(); state.hoverId = null; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0014));
}, {passive:false});
canvas.addEventListener('dblclick', e => zoomAt(e.clientX, e.clientY, 1.5));

/* ---------- device drawer ---------- */
const drawer = $('#drawer');
function openDrawer(id) {
  const d = devices.find(x => x.id === id); if (!d) return;
  state.selId = id; state.drTab = 'overview';
  closePanel();
  renderDrawer();
  drawer.classList.add('open');
  hideTooltip();
}
function closeDrawer() { drawer.classList.remove('open'); state.selId = null; }
function renderDrawer() {
  const d = devices.find(x => x.id === state.selId); if (!d) return;
  const st = displayState(d);
  $('#drBadge').innerHTML = '';
  $('#drBadge').textContent = glyph(d);
  $('#drBadge').style.fontFamily = 'var(--mono)';
  $('#drBadge').style.fontWeight = '700';
  $('#drBadge').style.color = cssVar(stateColor(st));
  $('#drName').childNodes[0].textContent = d.name + ' ';
  const pill = $('#drPill');
  pill.className = 'pill ' + st;
  pill.textContent = st === 'online' ? 'Connected' : st.charAt(0).toUpperCase() + st.slice(1);
  $('#drMeta').textContent = d.vendor + ' · ' + connLabel(d.conn) + (d.conn !== 'eth' && st !== 'offline' ? ' · ' + d.signal + ' dBm' : '');
  $$('.dr-tab').forEach(t => t.classList.toggle('active', t.dataset.dtab === state.drTab));
  const body = $('#drBody');
  if (state.drTab === 'overview') body.innerHTML = drawerOverview(d);
  else if (state.drTab === 'traffic') body.innerHTML = drawerTraffic(d);
  else body.innerHTML = drawerTroubleshoot(d);
  $('#drActions').innerHTML =
    '<button class="btn primary" data-action="dr-ping">Ping</button>' +
    '<button class="btn" data-action="dr-restart">Restart radio</button>' +
    (d.blocked
      ? '<button class="btn" data-action="dr-unblock">Allow internet</button>'
      : '<button class="btn danger" data-action="dr-block">Block</button>') +
    '<button class="btn" data-action="dr-copy">Copy IP</button>';
  if (state.drTab === 'traffic') {
    drawMini($('#trafficCanvas'), [
      {data:d.hDown, color:cssVar('--green')},
      {data:d.hUp, color:cssVar('--blue')}
    ]);
    if (d.hSig) drawMini($('#sigCanvas'), [{data:d.hSig, color:cssVar('--amber')}], -90, -40);
  }
}
function drawerOverview(d) {
  const st = displayState(d);
  const ssid = d.conn === 'wifi5' ? SETTINGS.ssid5 : SETTINGS.ssid24;
  return '<div class="facts">' +
      '<div class="fact"><div class="fl">Traffic now</div><div class="fv">↓ ' + (st === 'offline' || st === 'blocked' ? '—' : fmtM(d.down)) + '</div></div>' +
      '<div class="fact"><div class="fl">Upload</div><div class="fv">↑ ' + (st === 'offline' || st === 'blocked' ? '—' : fmtM(d.up)) + '</div></div>' +
      '<div class="fact"><div class="fl">Signal</div><div class="fv">' + (d.conn === 'eth' ? 'Wired' : st === 'offline' ? '—' : d.signal + ' dBm') + '</div></div>' +
      '<div class="fact"><div class="fl">Uptime</div><div class="fv">' + (st === 'offline' ? 'Offline' : d.uptime) + '</div></div>' +
    '</div>' +
    '<div class="subcard"><h4>Identity</h4><dl class="kv">' +
      '<dt>IP address</dt><dd>' + d.ip + '</dd>' +
      '<dt>MAC</dt><dd>' + d.mac + '</dd>' +
      '<dt>Vendor</dt><dd>' + esc(d.vendor) + '</dd>' +
      '<dt>DHCP</dt><dd>' + (d.reserved ? 'Reserved' : 'Dynamic') + '</dd>' +
      '<dt>Priority</dt><dd>' + d.priority + '</dd>' +
      '<dt>Access hours</dt><dd>' + d.schedule + '</dd>' +
    '</dl></div>' +
    '<div class="subcard"><h4>Connection</h4><dl class="kv">' +
      (d.conn === 'eth'
        ? '<dt>Interface</dt><dd>LAN · 1 Gbps</dd><dt>Duplex</dt><dd>Full</dd>'
        : '<dt>SSID</dt><dd>' + esc(ssid) + '</dd><dt>Band</dt><dd>' + (d.conn === 'wifi5' ? '5 GHz · Ch ' + SETTINGS.ch5 : '2.4 GHz · Ch ' + SETTINGS.ch24) + '</dd><dt>Security</dt><dd>' + SETTINGS.sec + '</dd>') +
      '<dt>Since</dt><dd>' + (st === 'offline' ? relTime(d.lastSeenTs) : d.uptime + ' ago') + '</dd>' +
    '</dl></div>' +
    (st === 'warning' ? '<div class="subcard" style="border-color:color-mix(in srgb,var(--amber) 45%,transparent)"><h4 style="color:var(--amber)">Needs attention</h4><div class="note">Signal is ' + d.signal + ' dBm — below the −75 dBm reliability floor. Try moving the device closer to the access point or switching bands.</div></div>' : '');
}
function drawerTraffic(d) {
  const peak = Math.max.apply(null, d.hDown);
  const avg = d.hDown.reduce((a, b) => a + b, 0) / d.hDown.length;
  return '<div class="facts">' +
      '<div class="fact"><div class="fl">Peak 60s</div><div class="fv">' + fmtM(peak) + '</div></div>' +
      '<div class="fact"><div class="fl">Average</div><div class="fv">' + fmtM(avg) + '</div></div>' +
    '</div>' +
    '<div class="chart-block"><div class="cb-head">Bandwidth<span class="right">last 60s</span></div><canvas id="trafficCanvas"></canvas></div>' +
    (d.hSig ? '<div class="chart-block"><div class="cb-head">Signal<span class="right">dBm</span></div><canvas id="sigCanvas"></canvas></div>' : '') +
    '<div class="note">Link thickness and packet dots on the map scale with live throughput — thicker means busier.</div>';
}
function drawerTroubleshoot(d) {
  return '<div class="diag-bar">' +
      '<button class="btn" data-action="diag" data-diag="ping">Ping</button>' +
      '<button class="btn" data-action="diag" data-diag="traceroute">Traceroute</button>' +
      '<button class="btn" data-action="diag" data-diag="dns">DNS lookup</button>' +
      '<button class="btn" data-action="diag" data-diag="renew">Renew DHCP</button>' +
    '</div>' +
    '<div class="term" id="term"><span class="muted-line">Ready — select a diagnostic for ' + esc(d.name) + ' (' + d.ip + ').</span></div>' +
    '<div class="note">Timeline: connected ' + d.uptime + ' ago · DHCP ' + (d.reserved ? 'reservation held' : 'dynamic lease, 18h left') +
    (displayState(d) === 'warning' ? ' · signal degraded at 14:02' : '') + '</div>';
}
function drawMini(canvasEl, series, minY, maxY) {
  if (!canvasEl) return;
  const dpr2 = window.devicePixelRatio || 1;
  const w = canvasEl.clientWidth, h = canvasEl.clientHeight;
  if (!w || !h) return;
  canvasEl.width = w * dpr2; canvasEl.height = h * dpr2;
  const c = canvasEl.getContext('2d');
  c.setTransform(dpr2, 0, 0, dpr2, 0, 0);
  c.clearRect(0, 0, w, h);
  let lo = minY, hi = maxY;
  if (lo == null) { lo = 0; hi = 1; series.forEach(s => s.data.forEach(v => { if (v > hi) hi = v; })); hi = Math.max(hi * 1.1, 1); }
  const pad = 4;
  series.forEach(s => {
    c.beginPath();
    s.data.forEach((v, i) => {
      const x = pad + i / (s.data.length - 1) * (w - pad * 2);
      const y = pad + (1 - (v - lo) / (hi - lo)) * (h - pad * 2);
      i ? c.lineTo(x, y) : c.moveTo(x, y);
    });
    c.strokeStyle = s.color; c.lineWidth = 1.6; c.stroke();
  });
}
function termAppend(lines) {
  const term = $('#term'); if (!term) return;
  lines.forEach((ln, i) => setTimeout(() => {
    const div = document.createElement('div');
    div.className = ln.cls || ''; div.textContent = ln.t;
    term.appendChild(div); term.scrollTop = term.scrollHeight;
  }, i * 220));
}
function runDiag(kind) {
  const d = devices.find(x => x.id === state.selId); if (!d) return;
  const off = displayState(d) === 'offline' || d.blocked;
  const lines = [];
  if (kind === 'ping') {
    lines.push({t:'$ ping -c 4 ' + d.ip, cls:'cmd'});
    if (off) {
      lines.push({t:'PING ' + d.ip + ': Request timeout.', cls:'warn-line'});
      lines.push({t:'--- 4 packets transmitted, 0 received, 100% packet loss ---', cls:'warn-line'});
    } else {
      for (let i = 1; i <= 4; i++) {
        const ms = d.conn === 'eth' ? 0.3 + Math.random()*0.9 : 2 + Math.random()*8 + Math.max(0, (d.signal + 75) * 0.4);
        lines.push({t:'64 bytes from ' + d.ip + ': icmp_seq=' + i + ' ttl=64 time=' + ms.toFixed(1) + ' ms', cls:'muted-line'});
      }
      lines.push({t:'--- 4 packets transmitted, 4 received, 0% packet loss ---'});
    }
  } else if (kind === 'traceroute') {
    lines.push({t:'$ traceroute -m 5 ' + d.ip, cls:'cmd'});
    lines.push({t:' 1  192.168.1.1 (gateway)   0.4 ms   0.3 ms   0.3 ms', cls:'muted-line'});
    if (!off) {
      lines.push({t:' 2  100.64.0.1 (isp-core)   4.1 ms   3.9 ms   4.0 ms', cls:'muted-line'});
      lines.push({t:' 3  ' + d.ip.padEnd(21) + (d.conn === 'eth' ? '0.6' : '5.2') + ' ms   ' + (d.conn === 'eth' ? '0.5' : '5.5') + ' ms', cls:'muted-line'});
      lines.push({t:'✓ Reached in 3 hops.'});
    } else lines.push({t:' 2  * * *  — no route to host', cls:'warn-line'});
  } else if (kind === 'dns') {
    lines.push({t:'$ dig +short ' + d.ip.split('.').pop() + '.home.arpa', cls:'cmd'});
    lines.push(off ? {t:';; connection timed out; no servers could be reached', cls:'warn-line'} : {t:d.ip, cls:'muted-line'});
    if (!off) lines.push({t:'✓ Resolved in ' + (2 + Math.random()*6).toFixed(1) + ' ms'});
  } else if (kind === 'renew') {
    lines.push({t:'$ dhclient -r ' + d.ip + ' && dhclient ' + d.ip, cls:'cmd'});
    lines.push({t:'DHCPRELEASE … to 192.168.1.1', cls:'muted-line'});
    lines.push({t:'DHCPACK: ' + d.ip + ' (' + (d.reserved ? 'reservation' : 'dynamic') + ', lease 24h)'});
    lines.push({t:'✓ Lease renewed.'});
  }
  termAppend(lines);
}

/* ---------- side panels (alerts / list / settings) ---------- */
function syncViewtabs() {
  $$('.viewtab').forEach(t => t.classList.toggle('active', (t.dataset.open || 'map') === (state.panel || 'map')));
}
function openPanel(kind) {
  if (kind === 'map') { closePanel(); return; }
  state.panel = kind;
  closeDrawer();
  renderPanel(); syncViewtabs();
}
function closePanel() { state.panel = null; $('#alertsPanel').classList.add('hidden'); syncViewtabs(); }
function renderPanel() {
  const el = $('#alertsPanel');
  if (!state.panel) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const title = $('#apTitle'), count = $('#apCount'), list = $('#apList');
  if (state.panel === 'alerts') {
    title.textContent = 'Alerts';
    count.textContent = unreadAlerts() + ' unresolved';
    list.innerHTML = state.alerts.length ? state.alerts.map(a =>
      '<button class="alert-item ' + a.sev + '" data-action="open-alert" data-id="' + a.id + '">' +
      '<span class="sev"></span><div><div class="msg">' + esc(a.msg) + '</div>' +
      '<div class="meta">' + relTime(a.ts) + ' · ' + a.sev + '</div></div></button>').join('')
      : '<div class="empty">No alerts — the network is healthy.</div>';
  } else if (state.panel === 'list') {
    const c = counts();
    title.textContent = 'Devices';
    count.textContent = (c.total - c.offline) + '/' + c.total + ' online';
    list.innerHTML = devices.map(d => {
      const st = displayState(d);
      return '<button class="alert-item info" data-action="open-device" data-id="' + d.id + '">' +
        '<span class="sev" style="background:' + cssVar(stateColor(st)) + '"></span>' +
        '<div><div class="msg">' + esc(d.name) + '</div><div class="meta">' + d.ip + ' · ' + connLabel(d.conn) +
        (st !== 'offline' && st !== 'blocked' && d.down + d.up > 0.05 ? ' · ↓ ' + fmtM(d.down) : '') + '</div></div></button>';
    }).join('');
  } else if (state.panel === 'settings') {
    title.textContent = 'Map settings';
    count.textContent = '';
    const sw = (key, label) => '<label class="sw-row">' +
      '<span class="switch"><input type="checkbox" data-opt="' + key + '"' + (state.opts[key] ? ' checked' : '') + '><span class="track"></span><span class="knob"></span></span>' +
      label + '</label>';
    list.innerHTML =
      '<div class="sw-wrap">' +
      sw('labels', 'Show device labels') +
      sw('traffic', 'Animate traffic packets') +
      sw('grid', 'Show map grid') +
      '</div><div class="empty" style="padding:14px">Drag to pan · scroll to zoom · click a node for details</div>';
    list.querySelectorAll('[data-opt]').forEach(inp => {
      inp.addEventListener('change', () => { state.opts[inp.dataset.opt] = inp.checked; });
    });
  }
}

/* ---------- quick jump ---------- */
function openCmdk() { $('#cmdk').classList.remove('hidden'); const i = $('#cmdkInput'); i.value = ''; state.cmdkSel = 0; renderCmdk(''); setTimeout(() => i.focus(), 0); }
const closeCmdk = () => $('#cmdk').classList.add('hidden');
function renderCmdk(q) {
  q = q.trim().toLowerCase();
  state.cmdkResults = devices.filter(d => !q || d.name.toLowerCase().includes(q) || d.ip.includes(q) || d.mac.toLowerCase().includes(q)).slice(0, 8);
  if (state.cmdkSel >= state.cmdkResults.length) state.cmdkSel = 0;
  $('#cmdkList').innerHTML = state.cmdkResults.length ? state.cmdkResults.map((d, i) =>
    '<button class="cmdk-item' + (i === state.cmdkSel ? ' sel' : '') + '" data-cmdk="' + d.id + '">' +
    '<span class="dot" style="width:8px;height:8px;border-radius:50%;background:' + cssVar(stateColor(displayState(d))) + '"></span>' +
    '<span><span class="ci-name">' + esc(d.name) + '</span><br><span class="ci-meta">' + d.ip + ' · ' + d.mac + '</span></span>' +
    '<span class="ci-right">' + connLabel(d.conn) + '</span></button>').join('') : '<div class="empty">No devices found.</div>';
}
function cmdkGo() {
  const d = state.cmdkResults[state.cmdkSel];
  if (!d) return;
  closeCmdk(); focusDevice(d); openDrawer(d.id);
}

/* ---------- global click delegation ---------- */
document.addEventListener('click', e => {
  const cmdkItem = e.target.closest('[data-cmdk]');
  if (cmdkItem) { state.cmdkSel = state.cmdkResults.findIndex(d => d.id === Number(cmdkItem.dataset.cmdk)); cmdkGo(); return; }
  const el = e.target.closest('[data-action], [data-dtab], [data-open]');
  if (!el) return;

  if (el.dataset.dtab) { state.drTab = el.dataset.dtab; renderDrawer(); return; }
  if (el.dataset.open) { openPanel(el.dataset.open); return; }

  const a = el.dataset.action;
  const d = devices.find(x => x.id === state.selId);
  switch (a) {
    case 'open-cmdk': openCmdk(); break;
    case 'close-drawer': closeDrawer(); break;
    case 'open-alerts': openPanel('alerts'); break;
    case 'open-list': openPanel('list'); break;
    case 'close-alerts': closePanel(); break;
    case 'zoom-in': zoomAt(W/2, H/2, 1.3); break;
    case 'zoom-out': zoomAt(W/2, H/2, 1/1.3); break;
    case 'fit': fitView(); break;
    case 'recenter': cam.x = gateway.x; cam.y = gateway.y; cam.scale = 1; break;
    case 'open-alert': {
      const al = state.alerts.find(x => x.id === Number(el.dataset.id));
      if (al) { al.read = true; if (al.devId) { const dd = devices.find(x => x.id === al.devId); if (dd) { focusDevice(dd); openDrawer(dd.id); state.drTab = 'troubleshoot'; renderDrawer(); } } }
      updateHud(); break;
    }
    case 'open-device': {
      const dd = devices.find(x => x.id === Number(el.dataset.id));
      if (dd) { closePanel(); focusDevice(dd); openDrawer(dd.id); }
      break;
    }
    case 'dr-copy': if (d) copyText(d.ip); break;
    case 'dr-ping': if (d) { state.drTab = 'troubleshoot'; renderDrawer(); setTimeout(() => runDiag('ping'), 60); } break;
    case 'dr-restart':
      if (d) confirmModal('Restart radio on ' + d.name + '?', 'The device will briefly disconnect and re-associate.', 'Restart', false, () => {
        toast(d.name + ' radio restarted');
        state.alerts.unshift({id: state.nextAlertId++, sev:'info', msg: d.name + ' reconnected', devId:d.id, ts:Date.now(), read:true});
      });
      break;
    case 'dr-block':
      if (d) confirmModal('Block ' + d.name + '?', 'Keeps its Wi-Fi connection but loses internet access until you allow it again.', 'Block internet', true, () => {
        d.blocked = true; toast(d.name + ' blocked from the internet', 'warn'); renderDrawer(); updateHud();
      });
      break;
    case 'dr-unblock': if (d) { d.blocked = false; toast(d.name + ' internet access restored'); renderDrawer(); updateHud(); } break;
    case 'diag': runDiag(el.dataset.diag); break;
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'cmdkInput') { state.cmdkSel = 0; renderCmdk(e.target.value); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if ($('#cmdk').classList.contains('hidden')) openCmdk(); else closeCmdk();
    return;
  }
  if (!$('#cmdk').classList.contains('hidden')) {
    if (e.key === 'Escape') closeCmdk();
    else if (e.key === 'ArrowDown') { e.preventDefault(); state.cmdkSel = Math.min(state.cmdkSel + 1, state.cmdkResults.length - 1); renderCmdk($('#cmdkInput').value); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); state.cmdkSel = Math.max(state.cmdkSel - 1, 0); renderCmdk($('#cmdkInput').value); }
    else if (e.key === 'Enter') { e.preventDefault(); cmdkGo(); }
    return;
  }
  if (e.key === 'Escape') { if (state.panel) closePanel(); else closeDrawer(); }
  if (e.key === '+' || e.key === '=') zoomAt(W/2, H/2, 1.2);
  if (e.key === '-') zoomAt(W/2, H/2, 1/1.2);
  if (e.key === '0') fitView();
});
$('#alertsBtn').addEventListener('click', () => { state.panel === 'alerts' ? closePanel() : openPanel('alerts'); });
$('#themeBtn').addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  $('#themeBtn').innerHTML = next === 'dark' ? MOON : SUN;
  try { localStorage.setItem('netdash-theme', next); } catch (err) {}
  if (state.selId) renderDrawer();
});
const SUN = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.1 3.1l1.4 1.4M11.5 11.5l1.4 1.4M12.9 3.1l-1.4 1.4M4.5 11.5l-1.4 1.4"/></svg>';
const MOON = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 9.5A5.8 5.8 0 0 1 6.5 2.5a5.8 5.8 0 1 0 7 7Z"/></svg>';

/* ---------- init ---------- */
try { const saved = localStorage.getItem('netdash-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); } catch (err) {}
$('#themeBtn').innerHTML = document.documentElement.getAttribute('data-theme') === 'light' ? SUN : MOON;
window.addEventListener('resize', () => { resize(); });
resize(); fitView();
updateHud();
requestAnimationFrame(loop);
setInterval(tick, 1000);
tick();
</script>
