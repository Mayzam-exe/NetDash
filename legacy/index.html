<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetDash — Network Dashboard</title>
<style>
:root{
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Cantarell", "Helvetica Neue", Arial, sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0a0e12; --panel:#10151b; --panel2:#151b23; --hover:#1a222b;
  --border:#202a34; --grid:rgba(255,255,255,.055);
  --text:#e2e9f0; --muted:#8093a5; --accent:#67e8f9; --on-acc:#06232a;
  --green:#4ade80; --amber:#fbbf24; --red:#f87171; --blue:#7dd3fc;
  --green-a:rgba(74,222,128,.2); --blue-a:rgba(125,211,252,.18);
  --term-bg:#080c10; --term-fg:#7ee0a3; --shadow:0 12px 32px rgba(0,0,0,.5);
}
:root[data-theme="light"]{
  --bg:#eef1f5; --panel:#ffffff; --panel2:#f5f7fa; --hover:#eaeef3;
  --border:#dce3ea; --grid:rgba(0,0,0,.07);
  --text:#16212c; --muted:#5c6d7e; --accent:#0e7490; --on-acc:#ffffff;
  --green:#16a34a; --amber:#d97706; --red:#e11d48; --blue:#0284c7;
  --green-a:rgba(22,163,74,.16); --blue-a:rgba(2,132,199,.14);
  --term-bg:#0d1117; --term-fg:#7ee787; --shadow:0 12px 32px rgba(22,33,44,.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);background:var(--bg);color:var(--text);
  font-size:14px;letter-spacing:.005em;-webkit-font-smoothing:antialiased;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.hidden{display:none!important}

.app{display:grid;grid-template-columns:200px 1fr;height:100vh;overflow:hidden}
.rail{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px;gap:3px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-weight:680;font-size:15px;letter-spacing:-.01em}
.brand .logo{width:26px;height:26px;border-radius:7px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:750;font-family:var(--mono)}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:7px;color:var(--muted);font-weight:550;font-size:13.5px;width:100%;text-align:left;transition:background .12s,color .12s}
.nav-item svg{width:17px;height:17px;flex:none}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.nav-item .nbadge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:1px 6px;min-width:18px;text-align:center}
.rail-foot{margin-top:auto;padding:11px 10px 4px;border-top:1px solid var(--border);color:var(--muted);font-size:11.5px;line-height:1.55}

.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:11px 20px;border-bottom:1px solid var(--border);background:var(--panel)}
.topbar h1{font-size:15px;margin:0;font-weight:650;letter-spacing:-.01em}
.searchbtn{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:7px 12px;color:var(--muted);min-width:250px;text-align:left;font-size:13px;transition:border-color .12s}
.searchbtn:hover{border-color:var(--muted);color:var(--text)}
.searchbtn kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.live{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em;font-family:var(--mono)}
.live .pulse{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 7px var(--accent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.icon-btn{width:32px;height:32px;border-radius:7px;border:1px solid var(--border);background:var(--panel2);display:grid;place-items:center;color:var(--muted);transition:color .12s,border-color .12s}
.icon-btn:hover{color:var(--text);border-color:var(--muted)}
.view{flex:1;overflow:auto;padding:16px 20px 24px;min-height:0}

.card{background:var(--panel);border:1px solid var(--border);border-radius:10px}
.card-title{font-size:13px;font-weight:650;color:var(--text);letter-spacing:-.01em}
.card-head{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);min-height:44px}
.card-head .right{margin-left:auto;display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12.5px}
.card-head .desc{font-size:12.5px;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:450}
.sep-dot{width:3px;height:3px;border-radius:50%;background:var(--muted);opacity:.55;display:inline-block;vertical-align:middle}

.dash{display:flex;flex-direction:column;gap:13px;height:100%;min-height:0}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;flex:none}
.kpi{background:var(--panel);padding:13px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:5px;min-width:0;position:relative;transition:background .12s}
.kpi.clickable:hover{background:var(--hover)}
.kpi-label{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.01em}
.kpi-big{font-family:var(--mono);font-size:24px;font-weight:640;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi-big.text{font-family:var(--sans);font-size:20px;font-weight:680;letter-spacing:-.015em}
.kpi-big .unit{font-size:12.5px;font-weight:550;color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi-row{display:flex;align-items:center;gap:8px}
.kpi-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-sub.pr{padding-right:76px}
.kpi-split{display:flex;gap:6px;flex-wrap:wrap}
.chipmini{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-weight:600}
.chipmini.ok{color:var(--green)} .chipmini.warn{color:var(--amber)} .chipmini.bad{color:var(--red)}
.spark{position:absolute;right:14px;bottom:13px;width:64px;height:24px;opacity:.9}
.down-ic{color:var(--green)} .up-ic{color:var(--blue)}

.scope .chart-wrap{height:112px;padding:6px 10px 0}
.scope .chart-legend{padding-top:2px}

.dash-body{display:grid;grid-template-columns:minmax(0,1.95fr) minmax(0,1fr);gap:13px;flex:1;min-height:0}
.right-rail{display:flex;flex-direction:column;gap:13px;min-height:0}
.table-card{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.table-toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);font-size:12.5px;font-weight:600;transition:color .12s,border-color .12s,background .12s}
.chip:hover{color:var(--text);border-color:var(--muted)}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--on-acc)}
.search-input{margin-left:auto;background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:7px 11px;width:210px;outline:none;font-size:13px;transition:border-color .12s}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}
.tbl-scroll{overflow:auto;flex:1;min-height:0}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{position:sticky;top:0;background:var(--panel);z-index:2;text-align:left;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.01em;padding:9px 14px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
.tbl th:hover{color:var(--text)}
.tbl th .arr{color:var(--accent);font-size:10px;margin-left:4px}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr{cursor:pointer;transition:background .1s}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.c-status{width:34px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.dot.on{background:var(--green);box-shadow:0 0 7px color-mix(in srgb,var(--green) 60%,transparent)}
.dot.online{background:var(--green);box-shadow:0 0 7px color-mix(in srgb,var(--green) 60%,transparent)}
.dot.warning{background:var(--amber)}
.dot.offline{background:transparent;border:2px solid var(--muted);width:9px;height:9px}
.dot.blocked{background:var(--muted)}
.dot.critical{background:var(--red);box-shadow:0 0 7px color-mix(in srgb,var(--red) 60%,transparent)}
.c-name .nm{font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;letter-spacing:-.005em}
.c-name .sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.sub.warn-text{color:var(--amber)}
.sub.blk-text{color:var(--muted);font-style:italic}
tr.st-offline td{opacity:.58}
tr.st-blocked td{opacity:.72}
tr.st-warning td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
tr.st-critical td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.copyable{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;border-radius:4px;padding:1px 4px;margin-left:-4px;transition:background .12s}
.copyable:hover{background:var(--panel2);outline:1px solid var(--border)}
.c-mac{color:var(--muted)}
.c-conn{white-space:nowrap;color:var(--muted);font-size:12.5px}
.sig{display:inline-flex;align-items:flex-end;gap:2px;margin-right:6px;vertical-align:middle}
.sig i{width:3px;background:var(--border);border-radius:1px}
.sig i:nth-child(1){height:5px}.sig i:nth-child(2){height:8px}.sig i:nth-child(3){height:11px}.sig i:nth-child(4){height:14px}
.sig i.on{background:var(--sg,var(--green))}
.sig-txt{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.thr{font-family:var(--mono);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.thr .dn{color:var(--green)} .thr .up{color:var(--blue)}
.c-act{width:40px;text-align:right}
.row-menu-btn{color:var(--muted);font-size:17px;line-height:1;padding:4px 6px;border-radius:6px;transition:background .12s,color .12s}
.row-menu-btn:hover{background:var(--panel2);color:var(--text)}
.tbl-foot{display:flex;align-items:center;gap:14px;padding:9px 14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend{display:flex;gap:12px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}

.chart-legend{display:flex;gap:14px;padding:0 16px 11px;font-size:12px;color:var(--muted)}
.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.chart-vals{margin-left:auto;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.chart-wrap{position:relative}
.chart-wrap canvas{width:100%;height:100%;display:block}
.chart-tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:6px 9px;font-family:var(--mono);font-size:11.5px;box-shadow:var(--shadow);z-index:5;white-space:nowrap;display:none}

.alerts-card{display:flex;flex-direction:column;min-height:0;flex:1}
.alert-list{overflow:auto;padding:6px;min-height:0}
.alert-item{display:flex;gap:10px;width:100%;text-align:left;padding:9px 11px;border-radius:8px;align-items:flex-start;transition:background .1s}
.alert-item:hover{background:var(--hover)}
.alert-item .sev{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.alert-item.critical .sev{background:var(--red)} .alert-item.warning .sev{background:var(--amber)} .alert-item.info .sev{background:var(--blue)}
.alert-item .msg{font-size:13px;line-height:1.45}
.alert-item .meta{font-size:11.5px;color:var(--muted);margin-top:2px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px}

.summary-strip{display:flex;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.sum-card{padding:10px 16px;display:flex;align-items:center;gap:9px}
.sum-card .num{font-size:18px;font-weight:680;font-family:var(--mono);font-variant-numeric:tabular-nums}
.sum-card .lbl{font-size:12px;color:var(--muted)}

.crumbs{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);margin-bottom:11px}
.crumbs a{color:var(--muted)} .crumbs a:hover{color:var(--text)}
.detail-head{padding:16px 18px;display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.dh-left{display:flex;gap:13px;align-items:center;min-width:0}
.dev-badge{width:44px;height:44px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);display:grid;place-items:center;color:var(--muted);flex:none}
.dev-badge svg{width:22px;height:22px}
.dh-left h2{margin:0;font-size:19px;font-weight:680;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:650;letter-spacing:.01em;padding:3px 10px;border-radius:20px}
.pill.on,.pill.online{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.pill.warning{background:color-mix(in srgb,var(--amber) 15%,transparent);color:var(--amber)}
.pill.offline{background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
.pill.blocked{background:var(--panel2);color:var(--muted);border:1px solid var(--border)}
.dh-meta{color:var(--muted);font-size:13px;margin-top:3px}
.dh-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:7px 14px;border-radius:7px;border:1px solid var(--border);background:var(--panel2);font-weight:600;font-size:13px;color:var(--text);transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-acc)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,transparent);background:color-mix(in srgb,var(--red) 8%,transparent)}
.btn.ghostdanger{color:var(--red);background:transparent}
.idrow{display:flex;gap:22px;padding:11px 18px;border-top:1px solid var(--border);flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.idrow b{color:var(--text);font-weight:600}
.idrow .cp{cursor:pointer;transition:color .12s}
.idrow .cp:hover{color:var(--accent)}

.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--border);margin-top:13px;background:var(--panel);border-radius:10px 10px 0 0;overflow-x:auto}
.tab{padding:12px 15px;font-weight:600;color:var(--muted);font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap;transition:color .12s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab-body{background:var(--panel);border:1px solid var(--border);border-top:none;border-radius:0 0 10px 10px;padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.facts{display:flex;gap:26px;padding:14px 16px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;margin-top:13px;flex-wrap:wrap}
.fact .fl{font-size:12px;color:var(--muted);font-weight:550}
.fact .fv{font-size:16px;font-weight:660;margin-top:3px;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 16px;align-items:baseline}
dl.kv dt{color:var(--muted);font-size:12.5px}
dl.kv dd{margin:0;font-size:13.5px;font-weight:550;text-align:right}
.subcard{border:1px solid var(--border);border-radius:9px;padding:14px 16px;background:var(--panel2)}
.subcard h4{margin:0 0 12px;font-size:12.5px;font-weight:650;color:var(--muted);letter-spacing:0}
.kpis-row{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:13px}
.kpi-sm{padding:13px 15px}
.kpi-sm .kpi-big{font-size:22px}
.chart-block{border:1px solid var(--border);border-radius:9px;padding:12px 12px 6px;background:var(--panel2);margin-bottom:13px}
.chart-block .cb-head{display:flex;align-items:center;gap:10px;padding:2px 6px 8px;font-size:13px;font-weight:650}
.chart-block .cb-head .right{margin-left:auto;color:var(--muted);font-weight:500;font-size:12px;font-family:var(--mono)}
.chart-block .chart-wrap{height:170px;padding:0}

.form-row{display:grid;grid-template-columns:220px minmax(0,340px) 1fr;gap:16px;align-items:center;padding:11px 0;border-bottom:1px solid var(--border)}
.form-row:last-child{border-bottom:none}
.form-row .flabel{font-weight:600;font-size:13.5px}
.form-row .fhint{font-size:12px;color:var(--muted);line-height:1.45}
.inp,select.inp{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:8px 11px;outline:none;width:100%;font-size:13.5px;transition:border-color .12s}
.inp:focus{border-color:var(--accent)}
.inp.mono{font-family:var(--mono);font-size:13px}
.inp:disabled{opacity:.5}
.inp::placeholder{color:var(--muted)}
.radio-group{display:flex;gap:14px;flex-wrap:wrap}
.radio-group label{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.switch{position:relative;display:inline-block;width:38px;height:21px;flex:none;vertical-align:middle}
.switch input{opacity:0;width:0;height:0}
.switch .sl{position:absolute;inset:0;background:var(--border);border-radius:20px;transition:.18s}
.switch .sl:before{content:"";position:absolute;width:15px;height:15px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s}
.switch input:checked + .sl{background:var(--green)}
.switch input:checked + .sl:before{transform:translateX(17px)}
.settings-sec{margin-bottom:13px}
.form-actions{display:flex;gap:10px;justify-content:flex-end;padding-top:6px}

.diag-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:13px}
.term{background:var(--term-bg);color:var(--term-fg);border:1px solid var(--border);border-radius:9px;font-family:var(--mono);font-size:12.5px;padding:13px 15px;min-height:190px;max-height:320px;overflow:auto;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.term .muted-line{color:#7d8b9c}
.term .warn-line{color:#f5b942}
.term .cmd{color:#79c0ff}
.timeline{margin-top:13px;padding:14px 16px}
.timeline h4{margin:0 0 12px;font-size:12.5px;font-weight:650;color:var(--muted)}
.tl-item{display:flex;gap:12px;padding:7px 0;position:relative}
.tl-time{font-family:var(--mono);font-size:12px;color:var(--muted);width:52px;flex:none;font-variant-numeric:tabular-nums}
.tl-dot{width:9px;height:9px;border-radius:50%;background:var(--blue);flex:none;margin-top:4px;position:relative}
.tl-item.warning .tl-dot{background:var(--amber)}
.tl-item.critical .tl-dot{background:var(--red)}
.tl-item:not(:last-child) .tl-dot:after{content:"";position:absolute;left:50%;top:12px;width:1px;height:26px;background:var(--border);transform:translateX(-.5px)}
.tl-txt{font-size:13px}

.menu{position:fixed;background:var(--panel);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);padding:5px;z-index:60;min-width:180px}
.menu button{display:block;width:100%;text-align:left;padding:8px 11px;border-radius:6px;font-size:13px;color:var(--text);transition:background .1s}
.menu button:hover{background:var(--hover)}
.menu .sep{height:1px;background:var(--border);margin:5px 4px}
.menu button.danger{color:var(--red)}

.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:80}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);width:min(430px,92vw);padding:20px}
.modal h3{margin:0 0 8px;font-size:16.5px;font-weight:680;letter-spacing:-.015em}
.modal p{margin:0 0 18px;color:var(--muted);font-size:13.5px;line-height:1.55}
.modal .m-actions{display:flex;gap:9px;justify-content:flex-end}

#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:9px;z-index:90}
.toast{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:9px;box-shadow:var(--shadow);padding:11px 15px;font-size:13.5px;max-width:340px;animation:tin .18s ease-out}
.toast.err{border-left-color:var(--red)} .toast.warn{border-left-color:var(--amber)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

.cmdk{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;display:grid;place-items:start center;padding-top:12vh}
.cmdk-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);width:min(560px,92vw);overflow:hidden}
.cmdk-box input{width:100%;padding:15px 17px;background:none;border:none;outline:none;font-size:15px;border-bottom:1px solid var(--border)}
.cmdk-list{max-height:320px;overflow:auto;padding:6px}
.cmdk-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:8px;transition:background .1s}
.cmdk-item:hover,.cmdk-item.sel{background:var(--hover)}
.cmdk-item .ci-name{font-weight:620;font-size:13.5px}
.cmdk-item .ci-meta{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.cmdk-item .ci-right{margin-left:auto;font-size:12px;color:var(--muted)}

.boot-overlay{position:fixed;inset:0;background:var(--bg);z-index:95;display:grid;place-items:center;gap:14px;align-content:center}
.boot-overlay .spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.alerts-view-list{display:flex;flex-direction:column;gap:8px}
.alert-row{display:flex;align-items:center;gap:13px;padding:13px 16px}
.alert-row .sev{width:9px;height:9px;border-radius:50%;flex:none}
.alert-row.critical .sev{background:var(--red)} .alert-row.warning .sev{background:var(--amber)} .alert-row.info .sev{background:var(--blue)}
.alert-row .msg{font-weight:600}
.alert-row .meta{font-size:12px;color:var(--muted);margin-top:2px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.alert-row .right{margin-left:auto;display:flex;gap:8px;align-items:center}

@media (max-width:1150px){
  .dash-body{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .right-rail{min-height:300px}
  .form-row{grid-template-columns:1fr}
  .scope .chart-wrap{height:140px}
}
@media (max-width:860px){
  .app{grid-template-columns:64px 1fr}
  .nav-item span.lbl,.brand span:not(.logo),.rail-foot{display:none}
  .nav-item{justify-content:center}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .kpis-row{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .searchbtn{min-width:0;width:40px}
  .searchbtn span,.searchbtn kbd{display:none}
  .c-mac,.th-mac{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

.map-legend{left:14px;bottom:14px;width:200px;background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:12px 15px;backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.map-legend h4{margin:0 0 8px;font-size:12px;font-weight:650;color:var(--muted)}
.map-legend .row{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:3px 0;color:var(--muted)}
.map-legend .row b{margin-left:auto;color:var(--text);font-family:var(--mono);font-size:11.5px;font-weight:600}
.map-legend .dotc{width:10px;height:10px;border-radius:50%;flex:none}
.map-legend .dotc.on{background:var(--green)}
.map-legend .dotc.warning{background:var(--amber)}
.map-legend .dotc.offline{border:2px solid var(--muted)}
.map-legend .dotc.blocked{background:var(--muted)}
.map-legend .ln{width:22px;height:0;border-top:2px solid var(--link);flex:none}
.map-legend .ln.warn{border-top-style:dashed;border-color:var(--amber)}
.map-legend .ln.off{border-top-style:dotted;border-color:var(--muted);opacity:.55}
.map-legend .sz{border-radius:50%;background:color-mix(in srgb,var(--accent) 28%,transparent);border:1.5px solid var(--accent);flex:none}
.map-legend .hint{margin-top:9px;padding-top:9px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.55}
.mapctl{right:14px;bottom:14px;display:flex;flex-direction:column;gap:5px;background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:6px;backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.mapctl button{width:32px;height:32px;border-radius:7px;border:1px solid var(--border);background:var(--panel2);color:var(--muted);font-size:15px;font-weight:600;display:grid;place-items:center;transition:color .12s,border-color .12s}
.mapctl button:hover{color:var(--text);border-color:var(--muted)}

.map-tip{position:absolute;z-index:8;pointer-events:none;background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:10px 12px;box-shadow:var(--shadow);display:none;min-width:178px}

.map-tip .tt-name .d{width:8px;height:8px;border-radius:50%;flex:none}

function seed(base, spread) {
  const a = []; let v = base;
  for (let i = 0; i < 60; i++) {
    v = clamp(v + (Math.random() - 0.5) * (spread || Math.max(0.6, base * 0.5)), 0, base * 2 + 2);
    a.push(Math.max(0, v));
  }
  if (base > 0) a[a.length - 1] = base;
  return a;

function counts() {
  const c = {online:0, warning:0, offline:0, blocked:0};
  devices.forEach(d => c[displayState(d)]++);
  c.connected = c.online + c.warning;
  c.total = devices.length;
  return c;
}
const unreadAlerts = () => state.alerts.filter(a => !a.read).length;

function subline(d) {
  const st = displayState(d);
  if (st === 'offline') return '<span>Last seen ' + relTime(d.lastSeenTs) + '</span>';
  if (st === 'blocked') return '<span class="blk-text">Blocked by you</span>';
  if (st === 'warning') return '<span class="warn-text">' + (d.signal < -77 ? 'Weak signal ' + d.signal + ' dBm' : 'Needs attention') + '</span>';
  return esc(d.vendor) + ' · ' + connLabel(d.conn);
}
function sigHtml(d) {
  if (d.conn === 'eth') return '<span class="sig-txt">▪ Wired</span>';
  if (displayState(d) === 'offline') return '<span class="sig-txt">—</span>';
  const s = d.signal, lvl = s >= -55 ? 4 : s >= -65 ? 3 : s >= -75 ? 2 : 1;
  const col = s >= -65 ? 'var(--green)' : s >= -75 ? 'var(--amber)' : 'var(--red)';
  let bars = '';
  for (let i = 1; i <= 4; i++) bars += '<i class="' + (i <= lvl ? 'on' : '') + '"></i>';
  return '<span class="sig" style="--sg:' + col + '">' + bars + '</span><span class="sig-txt">' + s + '</span>';
}
function thrHtml(d) {
  const st = displayState(d);
  if (st === 'offline' || st === 'blocked') return '<span class="sig-txt">—</span>';
  return '<span class="thr"><span class="dn">↓ ' + fmtM(d.down) + '</span>&nbsp;&nbsp;<span class="up">↑ ' + fmtM(d.up) + '</span></span>';
}
const stateLabel = st => st === 'on' || st === 'online' ? 'Connected' : st.charAt(0).toUpperCase() + st.slice(1);
const ipNum = ip => ip.split('.').reduce((acc, o) => acc * 256 + (+o), 0);

function filteredDevices() {
  const q = state.search.trim().toLowerCase();
  let list = devices.filter(d => {
    const st = displayState(d);
    if (state.filter === 'wifi' && d.conn === 'eth') return false;
    if (state.filter === 'wired' && d.conn !== 'eth') return false;
    if (state.filter === 'offline' && st !== 'offline' && st !== 'blocked') return false;
    if (q && !(d.name.toLowerCase().includes(q) || d.ip.includes(q) || d.mac.toLowerCase().includes(q) || d.vendor.toLowerCase().includes(q))) return false;
    return true;
  });
  const k = state.sort.key, dir = state.sort.dir;
  const rank = {critical:0, warning:1, online:2, blocked:3, offline:4};
  list.sort((a, b) => {
    let r = 0;
    if (k === 'name') r = a.name.localeCompare(b.name);
    else if (k === 'ip') r = ipNum(a.ip) - ipNum(b.ip);
    else if (k === 'mac') r = a.mac.localeCompare(b.mac);
    else if (k === 'conn') r = connLabel(a.conn).localeCompare(connLabel(b.conn));
    else if (k === 'signal') r = (a.signal == null ? -999 : a.signal) - (b.signal == null ? -999 : b.signal);
    else if (k === 'thr') r = (a.down + a.up) - (b.down + b.up);
    else if (k === 'state') r = rank[displayState(a)] - rank[displayState(b)];
    return r * dir;
  });
  return list;
}

function th(key, label, cls) {
  const active = state.sort.key === key;
  return '<th data-action="sort" data-key="' + key + '" class="' + (cls || '') + '">' + label +
    (active ? '<span class="arr">' + (state.sort.dir > 0 ? '↑' : '↓') + '</span>' : '') + '</th>';
}
function tableHtml() {
  const list = filteredDevices();
  const rows = list.map(d => {
    const st = displayState(d);
    return '<tr class="st-' + st + '" data-action="open-device" data-id="' + d.id + '" tabindex="0">' +
      '<td class="c-status"><span class="dot ' + st + '"></span></td>' +
      '<td class="c-name"><div class="nm">' + esc(d.name) + '</div><div class="sub">' + subline(d) + '</div></td>' +
      '<td><span class="copyable" data-action="copy" data-value="' + d.ip + '" title="Click to copy">' + d.ip + '</span></td>' +
      '<td class="c-mac"><span class="copyable" data-action="copy" data-value="' + d.mac + '" title="Click to copy">' + d.mac + '</span></td>' +
      '<td class="c-conn">' + connLabel(d.conn) + '</td>' +
      '<td>' + sigHtml(d) + '</td>' +
      '<td data-thr="' + d.id + '">' + thrHtml(d) + '</td>' +
      '<td class="c-act"><button class="row-menu-btn" data-action="menu" data-id="' + d.id + '" aria-label="Device actions">⋯</button></td>' +
    '</tr>';
  }).join('');
  return '<table class="tbl"><thead><tr>' +
    th('state', '') + th('name', 'Name') + th('ip', 'IP Address') + th('mac', 'MAC', 'th-mac') +
    th('conn', 'Connection') + th('signal', 'Signal') + th('thr', '↓ ↑ Mbps') + '<th></th>' +
    '</tr></thead><tbody id="devTbody">' +
    (rows || '<tr><td colspan="8"><div class="empty">No devices match your search.</div></td></tr>') + '</tbody></table>';
}
const legendHtml = () => '<div class="legend">' +
  '<span><span class="dot on"></span> connected</span>' +
  '<span><span class="dot warning"></span> warning</span>' +
  '<span><span class="dot offline"></span> offline</span>' +
  '<span><span class="dot blocked"></span> blocked</span></div>';
function toolbarHtml(title, viewAll) {
  const chip = (v, l) => '<button class="chip' + (state.filter === v ? ' active' : '') + '" data-action="filter" data-filter="' + v + '">' + l + '</button>';
  return '<div class="table-toolbar">' +
    '<span class="card-title">' + title + '</span>' +
    '<span class="chipmini">' + filteredDevices().length + ' shown</span>' +
    chip('all', 'All') + chip('wifi', 'Wi-Fi') + chip('wired', 'Wired') + chip('offline', 'Offline') +
    '<input class="search-input" id="devSearch" placeholder="Search name / IP / MAC…" value="' + esc(state.search) + '">' +
    (viewAll ? '<button class="chip" data-action="nav" data-href="#/devices">View all</button>' : '') +
    '</div>';
}
function alertItemHtml(a) {
  return '<button class="alert-item ' + a.sev + '" data-action="open-alert" data-id="' + a.id + '">' +
    '<span class="sev"></span><div><div class="msg">' + esc(a.msg) + '</div>' +
    '<div class="meta">' + relTime(a.ts) + ' · ' + a.sev + '</div></div></button>';
}
function dashboardView() {
  const c = counts();
  const alerts = state.alerts.slice(0, 6);
  const seg = (inner, action, href) => action
    ? '<button class="kpi clickable" data-action="' + action + '"' + (href ? ' data-href="' + href + '"' : '') + '>' + inner + '</button>'
    : '<div class="kpi">' + inner + '</div>';
  return '<div class="dash">' +
    '<div class="kpis">' +
      seg(
        '<span class="kpi-label">Internet</span>' +
        '<span class="kpi-row"><span class="dot on"></span><span class="kpi-big text">Online</span></span>' +
        '<span class="kpi-sub">Gateway 192.168.1.1 · <span id="kpiWanMs">' + Math.round(state.latency) + ' ms</span> · click to test</span>',
        'wan-test') +
      seg(
        '<span class="kpi-label">Latency</span>' +
        '<span class="kpi-big"><span id="kpiLat">' + Math.round(state.latency) + '</span><span class="unit">ms</span></span>' +
        '<span class="kpi-sub pr">to 1.1.1.1 · 0% loss</span>' +
        '<canvas class="spark" id="sparkLat"></canvas>') +
      seg(
        '<span class="kpi-label">Throughput</span>' +
        '<span class="kpi-big"><span class="down-ic">↓</span> <span id="kpiDown">0</span><span class="unit">Mb/s</span></span>' +
        '<span class="kpi-sub"><span class="up-ic">↑</span> <span id="kpiUp">0</span> Mb/s now</span>') +
      seg(
        '<span class="kpi-label">Devices</span>' +
        '<span class="kpi-big"><span id="kpiDevOn">' + c.connected + '</span> / ' + c.total + '</span>' +
        '<span class="kpi-split"><span class="chipmini ok" id="chipOnline">' + c.online + ' online</span>' +
        '<span class="chipmini warn" id="chipWarn">' + c.warning + ' warn</span>' +
        '<span class="chipmini bad" id="chipOff">' + (c.offline + c.blocked) + ' off/blk</span></span>',
        'nav', '#/devices') +
      seg(
        '<span class="kpi-label">Alerts</span>' +
        '<span class="kpi-big" style="color:' + (unreadAlerts() ? 'var(--amber)' : 'inherit') + '"><span id="kpiAlerts">' + unreadAlerts() + '</span></span>' +
        '<span class="kpi-sub">' + (unreadAlerts() ? 'needs attention' : 'all clear') + '</span>',
        'nav', '#/alerts') +
    '</div>' +
    '<section class="card scope">' +
      '<div class="card-head"><span class="card-title">Bandwidth</span>' +
        '<span class="right"><span id="bwNow">↓ 0 · ↑ 0</span><span class="sep-dot"></span>last 60 seconds</span></div>' +
      '<div class="chart-wrap"><canvas id="bwChart"></canvas><div class="chart-tip" id="bwTip"></div></div>' +
      '<div class="chart-legend"><span><i style="background:var(--green)"></i>Download</span><span><i style="background:var(--blue)"></i>Upload</span>' +
        '<span class="chart-vals" id="bwMax"></span></div>' +
    '</section>' +
    '<div class="dash-body">' +
      '<section class="card table-card">' +
        toolbarHtml('Devices', true) +
        '<div class="tbl-scroll">' + tableHtml() + '</div>' +
        '<div class="tbl-foot"><span id="tblCount">' + filteredDevices().length + ' of ' + devices.length + ' devices</span>' + legendHtml() + '</div>' +
      '</section>' +
      '<div class="right-rail">' +
        '<section class="card alerts-card">' +
          '<div class="card-head"><span class="card-title">Alerts</span>' +
            '<span class="right"><button class="chip" data-action="nav" data-href="#/alerts">View all</button></span></div>' +
          '<div class="alert-list" id="alertList">' +
            (alerts.length ? alerts.map(alertItemHtml).join('') : '<div class="empty">No alerts — the network is healthy.</div>') + '</div>' +
        '</section>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function devicesView() {
  const c = counts();
  return '<div class="summary-strip">' +
    '<div class="card sum-card"><span class="dot on"></span><span class="num">' + c.connected + '</span><span class="lbl">connected</span></div>' +
    '<div class="card sum-card"><span class="dot warning"></span><span class="num">' + c.warning + '</span><span class="lbl">warning</span></div>' +
    '<div class="card sum-card"><span class="dot offline"></span><span class="num">' + c.offline + '</span><span class="lbl">offline</span></div>' +
    '<div class="card sum-card"><span class="dot blocked"></span><span class="num">' + c.blocked + '</span><span class="lbl">blocked</span></div>' +
  '</div>' +
  '<section class="card table-card" style="height:calc(100vh - 210px)">' +
    toolbarHtml('All devices', false) +
    '<div class="tbl-scroll">' + tableHtml() + '</div>' +
    '<div class="tbl-foot"><span id="tblCount">' + filteredDevices().length + ' of ' + devices.length + ' devices</span>' + legendHtml() +
      '<span style="margin-left:auto">Click a row for details · click IP/MAC to copy</span></div>' +
  '</section>';
}

function alertsView() {
  const f = state.alertFilter;
  const list = state.alerts.filter(a => f === 'all' || a.sev === f);
  const chip = (v, l) => '<button class="chip' + (f === v ? ' active' : '') + '" data-action="alert-filter" data-filter="' + v + '">' + l + '</button>';
  const rows = list.map(a => {
    const dev = a.devId ? devices.find(d => d.id === a.devId) : null;
    return '<div class="card alert-row ' + a.sev + '">' +
      '<span class="sev"></span>' +
      '<div><div class="msg">' + esc(a.msg) + '</div>' +
      '<div class="meta">' + a.sev.toUpperCase() + ' · ' + relTime(a.ts) + (dev ? ' · ' + esc(dev.name) : '') + '</div></div>' +
      '<div class="right">' +
        (dev ? '<button class="btn" data-action="open-alert" data-id="' + a.id + '">Open device</button>' : '') +
        '<button class="btn" data-action="dismiss-alert" data-id="' + a.id + '">Dismiss</button>' +
      '</div></div>';
  }).join('');
  return '<div class="card table-toolbar" style="margin-bottom:14px;border-radius:12px;border-bottom:1px solid var(--border)">' +
      '<span class="card-title">Filter</span>' + chip('all', 'All') + chip('critical', 'Critical') + chip('warning', 'Warning') + chip('info', 'Info') +
      '<span class="chipmini" style="margin-left:auto">' + unreadAlerts() + ' unresolved</span></div>' +
    '<div class="alerts-view-list">' + (rows || '<div class="card empty">Nothing here — no alerts match this filter.</div>') + '</div>';
}

  const sel = (id, opts, val) => '<select class="inp" id="' + id + '">' + opts.map(o => '<option' + (o === val ? ' selected' : '') + '>' + o + '</option>').join('') + '</select>';
  const txt = (id, val, mono) => '<input class="inp' + (mono ? ' mono' : '') + '" id="' + id + '" value="' + esc(val) + '">';
  const sec = (title, desc, inner) => '<section class="card settings-sec"><div class="card-head"><span class="card-title">' + title + '</span><span class="desc" style="margin-left:12px">' + desc + '</span></div><div style="padding:6px 18px">' + inner + '</div></section>';

        '<button class="btn" data-action="discard-settings">Discard</button>' +
        '<button class="btn primary" data-action="save-settings">Save changes</button></div></div>' +
    sec('Internet', 'How your network reaches the world',
      row('Connection type', sel('gWanType', ['DHCP', 'PPPoE', 'Static'], s.wanType), 'Assigned automatically by your ISP on DHCP') +
      row('WAN IP', txt('gWanIp', s.wanIp, true), 'Lease 18h remaining') +
      row('DNS servers', '<div class="radio-group"><label><input type="radio" name="gDns" id="gDnsAuto"' + (s.dnsMode === 'auto' ? ' checked' : '') + '> Auto</label><label><input type="radio" name="gDns" id="gDnsCustom"' + (s.dnsMode === 'custom' ? ' checked' : '') + '> Custom</label></div><div style="display:flex;gap:8px;margin-top:8px">' + txt('gDns1', s.dns1, true) + txt('gDns2', s.dns2, true) + '</div>', 'Encrypted DNS (DoH) recommended')) +
    sec('Wi-Fi', 'Wireless network names and radio settings',
      row('2.4 GHz SSID', txt('gSsid24', s.ssid24), 'Channel ' + s.ch24 + ' · wider coverage, slower speeds') +
      row('2.4 GHz channel / bandwidth', '<div style="display:flex;gap:8px">' + sel('gCh24', ['Auto', '1', '6', '11'], s.ch24) + sel('gBw24', ['20 MHz', '40 MHz'], s.bw24) + '</div>', 'Channel 1, 6 or 11 to avoid overlap') +
      row('5 GHz SSID', txt('gSsid5', s.ssid5), 'Channel ' + s.ch5 + ' · fast, short range') +
      row('5 GHz channel / bandwidth', '<div style="display:flex;gap:8px">' + sel('gCh5', ['Auto', '36', '44', '149', '157'], s.ch5) + sel('gBw5', ['40 MHz', '80 MHz', '160 MHz'], s.bw5) + '</div>', '80 MHz is the best speed/range balance') +
      row('Security', sel('gSec', ['WPA3', 'WPA2/WPA3 mixed', 'WPA2'], s.sec), 'WPA3 recommended; WPA2 for older devices') +
      row('Password', txt('gPass', s.pass), 'Wi-Fi passphrase for both bands') +
      row('Guest network', sel('gGuest', ['Off', 'On — 2.4 GHz', 'On — both bands'], s.guest), 'Isolates visitors from your devices')) +
    sec('LAN & DHCP', 'Addresses inside your network',
      row('Router IP', txt('gRouterIp', s.routerIp, true), 'Your gateway and admin address') +
      row('DHCP range', '<div style="display:flex;gap:8px;align-items:center">' + txt('gDhcpStart', s.dhcpStart, true) + '<span style="color:var(--muted)">─</span>' + txt('gDhcpEnd', s.dhcpEnd, true) + '</div>', 'Dynamic addresses handed to new devices') +
      row('Lease time', sel('gLease', ['12 hours', '24 hours', '7 days'], s.lease), '12 devices hold reservations outside this pool')) +
    sec('Security', 'Firewall and exposure',
      row('Firewall', sel('gFirewall', ['On', 'Off'], s.firewall), 'Stateful packet inspection') +
      row('UPnP', sel('gUpnp', ['Off', 'On'], s.upnp), '⚠ Recommended off — limits unsolicited inbound connections') +
      row('Remote management', sel('gRemote', ['Off', 'On'], s.remote), '⚠ Keep off unless you need WAN admin access')) +
    '<section class="card settings-sec"><div class="card-head"><span class="card-title">System</span><span class="desc" style="margin-left:12px">Firmware and maintenance</span></div><div style="padding:14px 18px">' +
      '<div class="form-row"><div class="flabel">Firmware</div><div class="mono">v4.2.1 (up to date)</div><div class="fhint">Released 2026-08-30</div></div>' +
      '<div class="form-actions" style="justify-content:flex-start;flex-wrap:wrap;padding-top:14px">' +
        '<button class="btn" data-action="fw-check">Check for updates</button>' +
        '<button class="btn" data-action="export-config">Export config</button>' +
        '<button class="btn" data-action="import-config">Import config</button>' +
        '<button class="btn" data-action="reboot">Reboot router</button>' +
        '<button class="btn danger" data-action="factory-reset">Factory reset</button>' +
      '</div></div></section>';
}
function deviceView() {
  const d = devices.find(x => x.id === state.devId);
  if (!d) return '<div class="empty">Device not found. <a href="#/devices">Back to devices</a></div>';
  const st = displayState(d);
  const ssid = d.conn === 'wifi5' ? state.settings.ssid5 : state.settings.ssid24;
  const sigCol = d.signal == null ? 'var(--muted)' : d.signal >= -65 ? 'var(--green)' : d.signal >= -75 ? 'var(--amber)' : 'var(--red)';
  const header = '<div class="crumbs"><a href="#/devices">Devices</a><span>/</span><span>' + esc(d.name) + '</span></div>' +
    '<section class="card">' +
      '<div class="detail-head">' +
        '<div class="dh-left"><div class="dev-badge">' + (ICONS[d.kind] || ICONS.phone) + '</div>' +
        '<div><h2>' + esc(d.name) + '<span class="pill ' + st + '">' + stateLabel(st) + '</span></h2>' +
        '<div class="dh-meta">' + esc(d.vendor) + ' · ' + connLabel(d.conn) + (d.conn !== 'eth' ? ' · ' + esc(ssid) : ' · 1 Gbps') + '</div></div></div>' +
        '<div class="dh-actions">' +
          '<button class="btn primary" data-action="quick-ping" data-id="' + d.id + '">Ping</button>' +
          '<button class="btn" data-action="locate" data-id="' + d.id + '">Show on map</button>' +
          '<button class="btn" data-action="restart-radio" data-id="' + d.id + '">Restart</button>' +
          (d.blocked
            ? '<button class="btn" data-action="unblock" data-id="' + d.id + '">Allow internet</button>'
            : '<button class="btn danger" data-action="block" data-id="' + d.id + '">Block</button>') +
          '<button class="btn ghostdanger" data-action="forget" data-id="' + d.id + '">Forget</button>' +
        '</div>' +
      '</div>' +
      '<div class="idrow">' +
        '<span>IP <b class="cp mono" data-action="copy" data-value="' + d.ip + '">' + d.ip + '</b></span>' +
        '<span>MAC <b class="cp mono" data-action="copy" data-value="' + d.mac + '">' + d.mac + '</b></span>' +
        '<span>' + (d.conn === 'eth' ? 'Link <b>1 Gbps full duplex</b>' : 'Signal <b style="color:' + sigCol + '">' + (st === 'offline' ? '—' : d.signal + ' dBm') + '</b>') + '</span>' +
        '<span>' + (st === 'offline' ? 'Last seen <b>' + relTime(d.lastSeenTs) + '</b>' : 'Connected <b>' + d.uptime + '</b>') + '</span>' +
      '</div>' +
    '</section>';
  const tabs = '<div class="tabs">' +
    ['overview', 'performance', 'settings', 'troubleshoot'].map(t =>
      '<button class="tab' + (state.tab === t ? ' active' : '') + '" data-action="tab" data-tab="' + t + '">' +
      t.charAt(0).toUpperCase() + t.slice(1) + '</button>').join('') +
  '</div>';
  return header + tabs + '<div class="tab-body">' + deviceTab(d) + '</div>';
}

function deviceTab(d) {
  if (state.tab === 'overview') return tabOverview(d);
  if (state.tab === 'performance') return tabPerformance(d);
  if (state.tab === 'settings') return tabDeviceSettings(d);
  return tabTroubleshoot(d);
}

function tabOverview(d) {
  const st = displayState(d);
  const ssid = d.conn === 'wifi5' ? state.settings.ssid5 : state.settings.ssid24;
  const conn = d.conn === 'eth'
    ? '<div class="subcard"><h4>Connection</h4><dl class="kv">' +
      '<dt>Interface</dt><dd>LAN 3 · 1 Gbps</dd>' +
      '<dt>Duplex</dt><dd>Full</dd>' +
      '<dt>Cable</dt><dd>Cat6</dd>' +
      '<dt>Since</dt><dd>' + d.uptime + ' ago</dd></dl></div>'
    : '<div class="subcard"><h4>Connection</h4><dl class="kv">' +
      '<dt>SSID</dt><dd>' + esc(ssid) + '</dd>' +
      '<dt>Band</dt><dd>' + (d.conn === 'wifi5' ? '5 GHz · Ch ' + state.settings.ch5 : '2.4 GHz · Ch ' + state.settings.ch24) + '</dd>' +
      '<dt>Signal</dt><dd>' + (st === 'offline' ? '—' : sigHtml(d) + ' ' + d.signal + ' dBm') + '</dd>' +
      '<dt>Security</dt><dd>' + state.settings.sec + '</dd>' +
      '<dt>Access point</dt><dd>Living Room AP</dd>' +
      '<dt>Since</dt><dd>' + d.uptime + ' ago</dd></dl></div>';
  const hD = d.hDown, peak = Math.max.apply(null, hD), avg = hD.reduce((a, b) => a + b, 0) / hD.length;
  return '<div class="grid2">' +
      '<div class="subcard"><h4>Identity</h4><dl class="kv">' +
        '<dt>Vendor</dt><dd>' + esc(d.vendor) + '</dd>' +
        '<dt>Hostname</dt><dd class="mono">' + esc(d.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')) + '</dd>' +
        '<dt>IP address</dt><dd class="mono">' + d.ip + '</dd>' +
        '<dt>MAC</dt><dd class="mono">' + d.mac + '</dd>' +
        '<dt>DHCP</dt><dd>' + (d.reserved ? 'Reservation · static' : 'Dynamic · 18h left') + '</dd>' +
        '<dt>Priority</dt><dd>' + d.priority.charAt(0).toUpperCase() + d.priority.slice(1) + '</dd>' +
      '</dl></div>' + conn +
    '</div>' +

function push(arr, v, cap) { arr.push(v); while (arr.length > (cap || 60)) arr.shift(); }

function tick() {
  let totalDown = 0, totalUp = 0;
  devices.forEach(d => {
    const st = displayState(d);
    if (st === 'offline' || st === 'blocked') {
      d.down = 0; d.up = 0;
    } else if (d.baseDown === 0 && d.baseUp === 0) {
      d.down = 0; d.up = 0;
    } else {
      const jitter = base => base === 0 ? 0 : Math.max(0, base + (Math.random() - 0.5) * base * 0.5 + (Math.random() - 0.4) * 0.4);
      d.down = clamp(jitter(d.baseDown), 0, d.baseDown * 1.8 + 2);
      d.up = clamp(jitter(d.baseUp), 0, d.baseUp * 1.8 + 1);
      if (d.signal != null && d.conn !== 'eth') {
        d.signal = Math.round(clamp(d.signal + (Math.random() < 0.3 ? (Math.random() < 0.5 ? -1 : 1) : 0), d.baseSignal - 4, d.baseSignal + 4));
        push(d.hSig, d.signal);
        if (d.state === 'warning' && d.signal > -75 && d.baseSignal > -75) d.state = 'online';
        if (d.state === 'online' && d.signal < -77) d.state = 'warning';
      }
      push(d.hDown, d.down); push(d.hUp, d.up);
    }
    totalDown += d.down; totalUp += d.up;
  });
  push(state.series.down, totalDown); push(state.series.up, totalUp);
  if (state.spike > 2) { state.spike *= 0.72; } else { state.spike = Math.random() < 0.05 ? 50 + Math.random() * 110 : 0; }
  state.latency = 13 + Math.random() * 4 + state.spike;
  push(state.series.lat, state.latency);
  if (Math.random() < 0.012) generateAlert();
  updateLiveDom(totalDown, totalUp);
}

function generateAlert() {
  const pool = devices.filter(d => displayState(d) !== 'offline');
  const d = pool[Math.floor(Math.random() * pool.length)];
  if (!d) return;
  let msg, sev = 'warning';
  if (d.conn !== 'eth' && d.signal < -72) msg = d.name + ': signal dropped to ' + d.signal + ' dBm';
  else if (state.spike > 60) { msg = 'WAN latency spike: ' + Math.round(state.latency) + ' ms to 1.1.1.1'; sev = state.spike > 130 ? 'critical' : 'warning'; }
  else { msg = d.name + ' reconnected after brief drop'; sev = 'info'; }
  state.alerts.unshift({id: state.nextAlertId++, sev, msg, devId: sev === 'info' ? d.id : d.id, ts: Date.now(), read: false});
  while (state.alerts.length > 14) state.alerts.pop();
  if (state.view === 'dashboard') {
    const list = $('#alertList');
    if (list) list.innerHTML = state.alerts.slice(0, 6).map(alertItemHtml).join('');
  }
  updateBadge();
}

function atlasLayout() {
  atlas.layout.clear();

  atlas.layout.set('wan', {x:ATLAS_WAN.x, y:ATLAS_WAN.y});
  const groups = {eth:[], wifi5:[], wifi2:[]};
  devices.forEach(d => groups[d.conn].push(d));
  const GOLD = 2.39996322973;
  Object.keys(groups).forEach((conn, gi) => {
    groups[conn].forEach((d, i) => {
      const baseR = conn === 'eth' ? 210 : conn === 'wifi5' ? 330 : 430;
      const sigR = Number.isFinite(d.signal) && displayState(d) !== 'offline' ? (-d.signal - 40) * 5.4 : 130;
      const dim = displayState(d) === 'offline' || displayState(d) === 'blocked' ? 70 : 0;

      const r = baseR + sigR * (conn === 'eth' ? 0 : 1) + dim + jit;

/* --- routing --- */
const TITLES = {dashboard:'Dashboard', map:'Network Map', devices:'Devices', alerts:'Alerts', settings:'Settings', device:'Device'};

function route() {
  const hash = location.hash.replace(/^#/, '') || '/dashboard';
  const parts = hash.split('/').filter(Boolean);
  closeMenu();
  if (parts[0] === 'device' && parts[1]) {
    state.view = 'device';
    state.devId = Number(parts[1]);
    if (parts[2]) state.tab = parts[2];
  } else {
    state.view = parts[0] || 'dashboard';
    if (state.view !== 'device') state.devId = null;
  }
  render();
}

function render() {
  const view = $('#view');
  let html = '';
  if (state.view === 'dashboard') html = dashboardView();
  else if (state.view === 'map') html = mapView();
  else if (state.view === 'devices') html = devicesView();
  else if (state.view === 'alerts') html = alertsView();
  else if (state.view === 'settings') html = settingsView();
  else if (state.view === 'device') html = deviceView();
  else html = dashboardView();
  view.innerHTML = html;
  view.classList.toggle('map-mode', state.view === 'map');
  $('#pageTitle').textContent = state.view === 'device'
    ? ((devices.find(d => d.id === state.devId) || {}).name || 'Device')
    : (TITLES[state.view] || 'Dashboard');
  $$('.nav-item').forEach(n => {
    const href = n.getAttribute('data-href');
    const active = href === '#/' + state.view || (state.view === 'device' && href === '#/devices');
    n.classList.toggle('active', active);
  });
  updateBadge();
  refreshCharts();
  if (state.view === 'map') atlasMount(); else atlasUnmount();
  const s = $('#devSearch');
  if (s && state.focusSearch) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); state.focusSearch = false; }
  if (state.pendingDiag) {
    const pd = state.pendingDiag; state.pendingDiag = null;
    setTimeout(() => runDiag(pd.id, pd.kind), 60);
  }
  const bn = $('#bwNow');
  if (bn) updateLiveDom(sumDown(), sumUp());
}
const sumDown = () => devices.reduce((a, d) => a + d.down, 0);
const sumUp = () => devices.reduce((a, d) => a + d.up, 0);
/* --- toasts / modal / copy --- */
function toast(msg, kind) {
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');

  $('#toasts').appendChild(t);

function confirmModal(title, body, okLabel, danger, onOk) {
  const root = $('#modalRoot');
  root.innerHTML = '<div class="modal-back"><div class="modal">' +
    '<h3>' + esc(title) + '</h3><p>' + esc(body) + '</p>' +
    '<div class="m-actions"><button class="btn" data-m="cancel">Cancel</button>' +
    '<button class="btn ' + (danger ? 'danger' : 'primary') + '" data-m="ok">' + esc(okLabel) + '</button></div>' +
  '</div></div>';
  root.querySelector('[data-m="cancel"]').onclick = () => { root.innerHTML = ''; };
  root.querySelector('[data-m="ok"]').onclick = () => { root.innerHTML = ''; onOk(); };
  root.querySelector('.modal-back').onclick = e => { if (e.target === e.currentTarget) root.innerHTML = ''; };

function copyText(v) {
  const done = () => toast('Copied ' + v);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(v).then(done, () => fallback());
  } else fallback();

    const ta = document.createElement('textarea');
    ta.value = v; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed', 'err'); }
    ta.remove();
  }
}

/* --- diagnostics --- */
function termAppend(lines) {
  const term = $('#term'); if (!term) return;
  lines.forEach((ln, i) => {
    setTimeout(() => {
      const div = document.createElement('div');
      div.className = ln.cls || '';
      div.textContent = ln.t;
      term.appendChild(div);
      term.scrollTop = term.scrollHeight;

}

        {t: 'Bringing ' + (d.conn === 'eth' ? 'eth0' : 'wlan0') + ' down…', cls: 'muted-line'},
        {t: 'Interface down. Waiting 1s…', cls: 'muted-line'},
        {t: 'Interface up. Re-associating…', cls: 'muted-line'},
        {t: 'Associated → ' + (d.conn === 'eth' ? 'LAN' : (d.conn === 'wifi5' ? state.settings.ssid5 : state.settings.ssid24)) + ' (' + (d.signal || 'wired') + (d.signal ? ' dBm' : '') + ')', cls: 'muted-line'},

      lines.push({t: 'PING ' + ip + ': Request timeout.', cls: 'warn-line'});
      lines.push({t: '--- 4 packets transmitted, 0 received, 100% packet loss ---', cls: 'warn-line'});
    } else {

      lines.push({t: ' 3  ' + ip + '                      ' + (d.conn === 'eth' ? '0.6' : '5.2') + ' ms   ' + (d.conn === 'eth' ? '0.5' : '5.5') + ' ms   ' + (d.conn === 'eth' ? '0.5' : '4.9') + ' ms', cls: 'muted-line'});

    }
  } else if (kind === 'dns') {
    lines.push({t: '$ dig +short ' + d.name.toLowerCase().replace(/[^a-z0-9]+/g, '-') .replace(/^-|-$/g,'') + '.local', cls: 'cmd'});
    if (displayState(d) === 'offline') {
      lines.push({t: ';; connection timed out; no servers could be reached', cls: 'warn-line'});
    } else {
      lines.push({t: ip, cls: 'muted-line'});
      lines.push({t: '✓ Resolved via ' + state.settings.dns1 + ' in ' + (2 + Math.random() * 6).toFixed(1) + ' ms', cls: ''});
    }
  } else if (kind === 'renew') {
    lines.push({t: '$ dhclient -r ' + ip + ' && dhclient ' + ip, cls: 'cmd'});
    lines.push({t: 'DHCPRELEASE on ' + (d.conn === 'eth' ? 'eth0' : 'wlan0') + ' to 192.168.1.1…', cls: 'muted-line'});
    lines.push({t: 'DHCPDISCOVER on ' + (d.conn === 'eth' ? 'eth0' : 'wlan0') + '…', cls: 'muted-line'});
    if (d.reserved) lines.push({t: 'DHCPACK from 192.168.1.1: ' + ip + ' (reservation held, lease 24h)', cls: ''});
    else lines.push({t: 'DHCPACK from 192.168.1.1: ' + ip + ' (lease 24h)', cls: ''});
    lines.push({t: '✓ Lease renewed.', cls: ''});
  }
  termAppend(lines);
}

/* --- quick jump (Ctrl/Cmd+K) --- */
function openCmdk() {
  $('#cmdk').classList.remove('hidden');
  const inp = $('#cmdkInput');
  inp.value = ''; state.cmdkSel = 0;
  renderCmdk('');
  setTimeout(() => inp.focus(), 0);
}
const closeCmdk = () => $('#cmdk').classList.add('hidden');
function renderCmdk(q) {
  q = q.trim().toLowerCase();
  state.cmdkResults = devices.filter(d =>
    !q || d.name.toLowerCase().includes(q) || d.ip.includes(q) || d.mac.toLowerCase().includes(q)
  ).slice(0, 8);
  if (state.cmdkSel >= state.cmdkResults.length) state.cmdkSel = 0;
  $('#cmdkList').innerHTML = state.cmdkResults.length
    ? state.cmdkResults.map((d, i) =>
        '<button class="cmdk-item' + (i === state.cmdkSel ? ' sel' : '') + '" data-cmdk="' + d.id + '">' +
        '<span class="dot ' + displayState(d) + '"></span>' +
        '<span><span class="ci-name">' + esc(d.name) + '</span><br><span class="ci-meta">' + d.ip + ' · ' + d.mac + '</span></span>' +
        '<span class="ci-right">' + connLabel(d.conn) + '</span></button>').join('')
    : '<div class="empty">No devices found.</div>';
}
function cmdkGo() {
  const d = state.cmdkResults[state.cmdkSel];
  if (d) { closeCmdk(); location.hash = '#/device/' + d.id + '/overview'; }
}

/* --- settings IO --- */
function collectGlobalSettings() {
  const g = id => { const el = document.getElementById(id); return el ? el.value : null; };
  const s = state.settings;
  if (g('gWanType') != null) {
    s.wanType = g('gWanType'); s.wanIp = g('gWanIp');
    s.dnsMode = $('#gDnsAuto').checked ? 'auto' : 'custom';
    s.dns1 = g('gDns1'); s.dns2 = g('gDns2');
    s.ssid24 = g('gSsid24'); s.ch24 = g('gCh24'); s.bw24 = g('gBw24');
    s.ssid5 = g('gSsid5'); s.ch5 = g('gCh5'); s.bw5 = g('gBw5');
    s.sec = g('gSec'); s.pass = g('gPass'); s.guest = g('gGuest');
    s.routerIp = g('gRouterIp'); s.dhcpStart = g('gDhcpStart'); s.dhcpEnd = g('gDhcpEnd'); s.lease = g('gLease');
    s.firewall = g('gFirewall'); s.upnp = g('gUpnp'); s.remote = g('gRemote');
  }
}
function saveDevice(id) {
  const d = devices.find(x => x.id === id); if (!d) return;
  const name = ($('#dnName') || {}).value;
  if (name && name.trim()) d.name = name.trim();
  d.reserved = $('#dnReserve') ? $('#dnReserve').checked : d.reserved;
  d.blocked = $('#dnAccess') ? $('#dnAccess').value === 'blocked' : d.blocked;
  d.priority = $('#dnPriority') ? $('#dnPriority').value : d.priority;
  if ($('#dnFrom') && $('#dnTo')) d.schedule = $('#dnFrom').value + '–' + $('#dnTo').value;
  toast('Settings saved for ' + d.name);
  render();
}
function goTab(devId, tab) { location.hash = '#/device/' + devId + '/' + tab; }

/* --- global click delegation --- */
document.addEventListener('click', e => {
  const cmdkItem = e.target.closest('[data-cmdk]');
  if (cmdkItem) { state.cmdkSel = state.cmdkResults.findIndex(d => d.id === Number(cmdkItem.dataset.cmdk)); cmdkGo(); return; }
  const el = e.target.closest('[data-action]');
  if (!el) { closeMenu(); return; }
  const a = el.dataset.action;
  const id = Number(el.dataset.id);
  if (a !== 'menu') closeMenu();

  switch (a) {
    case 'nav': location.hash = el.dataset.href; break;
    case 'open-device': location.hash = '#/device/' + id + '/overview'; break;
    case 'tab': state.tab = el.dataset.tab; render(); break;
    case 'copy': copyText(el.dataset.value); break;
    case 'filter': state.filter = el.dataset.filter; state.focusSearch = false; render(); break;
    case 'sort': {
      const k = el.dataset.key;
      if (state.sort.key === k) state.sort.dir *= -1;
      else state.sort = {key: k, dir: 1};
      render(); break;
    }
    case 'menu': e.stopPropagation(); openMenu(el, devices.find(d => d.id === id)); break;
    case 'alert-filter': state.alertFilter = el.dataset.filter; render(); break;
    case 'dismiss-alert': {
      const al = state.alerts.find(x => x.id === id);
      if (al) al.read = true;
      state.alerts = state.alerts.filter(x => !x.read || x.sev !== 'info' ? true : true);
      render(); toast('Alert dismissed'); break;
    }
    case 'open-alert': {
      const al = state.alerts.find(x => x.id === id);
      if (al) al.read = true;
      if (al && al.devId) goTab(al.devId, 'troubleshoot');
      else render();
      updateBadge(); break;
    }
    case 'open-cmdk': openCmdk(); break;
    case 'toggle-theme': {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      $('#themeBtn').innerHTML = next === 'dark' ? MOON : SUN;
      try { localStorage.setItem('netdash-theme', next); } catch (err) {}
      refreshCharts(); break;
    }
    case 'wan-test': toast('WAN OK · 1.1.1.1 replied in ' + Math.round(state.latency) + ' ms · 0% loss'); break;
    case 'quick-ping': goTab(id, 'troubleshoot'); state.pendingDiag = {id, kind: 'ping'}; break;
    case 'locate': state.atlasFocus = id; location.hash = '#/map'; break;
    case 'troubleshoot': goTab(id, 'troubleshoot'); break;
    case 'rename': goTab(id, 'settings'); setTimeout(() => { const n = $('#dnName'); if (n) { n.focus(); n.select(); } }, 80); break;
    case 'diag': runDiag(id, el.dataset.diag); break;
    case 'restart-radio': runDiag(id, 'restart'); break;
    case 'block':
      confirmModal('Block ' + (devices.find(d => d.id === id) || {}).name + '?',
        'The device keeps its Wi-Fi connection but loses internet access until you allow it again.',
        'Block internet', true, () => {
          const d = devices.find(x => x.id === id);
          if (d) { d.blocked = true; state.alerts.unshift({id: state.nextAlertId++, sev: 'info', msg: d.name + ' internet access blocked by you', devId: d.id, ts: Date.now(), read: true}); }
          toast((d || {}).name + ' blocked from the internet', 'warn');
          render();
        });
      break;
    case 'unblock': {
      const d = devices.find(x => x.id === id);
      if (d) d.blocked = false;
      toast((d || {}).name + ' internet access restored');
      render(); break;
    }
    case 'forget':
      confirmModal('Forget this device?',
        'NetDash will stop tracking it. The device can rejoin the network and reappear later.',
        'Forget', true, () => {
          const i = devices.findIndex(x => x.id === id);
          if (i >= 0) { const nm = devices[i].name; devices.splice(i, 1); toast(nm + ' removed'); }
          if (state.view === 'device') location.hash = '#/devices'; else render();
        });
      break;
    case 'save-device': saveDevice(id); break;
    case 'discard-device': render(); toast('Changes discarded', 'warn'); break;
    case 'save-settings': collectGlobalSettings(); toast('Settings saved'); render(); break;
    case 'discard-settings': state.settings = Object.assign({}, SETTINGS); render(); toast('Changes discarded', 'warn'); break;
    case 'fw-check': toast('Firmware v4.2.1 is up to date'); break;
    case 'export-config': {
      const blob = new Blob([JSON.stringify({settings: state.settings, devices: devices.map(d => ({name: d.name, ip: d.ip, mac: d.mac, reserved: d.reserved}))}, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a2 = document.createElement('a');
      a2.href = url; a2.download = 'netdash-config.json'; a2.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast('Configuration exported'); break;
    }
    case 'import-config': $('#importFile').click(); break;
    case 'reboot':
      confirmModal('Reboot router?', 'All devices will lose connectivity for ~60 seconds. The dashboard will resume when the router is back.', 'Reboot', false, () => {
        const ov = document.createElement('div');
        ov.className = 'boot-overlay';
        ov.innerHTML = '<div class="spin"></div><div style="color:var(--muted)">Rebooting router…</div>';
        document.body.appendChild(ov);
        setTimeout(() => { ov.remove(); toast('Router is back online · uptime 0m'); }, 2600);
      });
      break;
    case 'factory-reset':
      confirmModal('Factory reset?', 'ALL settings, reservations and rules will be wiped and the router returns to defaults. This cannot be undone.', 'Erase everything', true, () => toast('Factory reset is disabled in this prototype', 'err'));
      break;
  }
});

/* --- search input --- */
document.addEventListener('input', e => {
  if (e.target.id === 'devSearch') {
    state.search = e.target.value;
    state.focusSearch = true;
    const scroll = $('.tbl-scroll');
    const st = scroll ? scroll.scrollTop : 0;
    render();
    const sc2 = $('.tbl-scroll'); if (sc2) sc2.scrollTop = st;
  } else if (e.target.id === 'cmdkInput') {
    state.cmdkSel = 0;
    renderCmdk(e.target.value);
  }
});

/* --- keyboard --- */
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if ($('#cmdk').classList.contains('hidden')) openCmdk(); else closeCmdk();
    return;
  }
  if (!$('#cmdk').classList.contains('hidden')) {
    if (e.key === 'Escape') closeCmdk();
    else if (e.key === 'ArrowDown') { e.preventDefault(); state.cmdkSel = Math.min(state.cmdkSel + 1, state.cmdkResults.length - 1); renderCmdk($('#cmdkInput').value); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); state.cmdkSel = Math.max(state.cmdkSel - 1, 0); renderCmdk($('#cmdkInput').value); }
    else if (e.key === 'Enter') { e.preventDefault(); cmdkGo(); }
    return;
  }
  if (e.key === 'Escape') closeMenu();
  if (state.view === 'map' && !e.ctrlKey && !e.metaKey &&
      !(document.activeElement && document.activeElement.matches('input, textarea'))) {
    if (e.key === '+' || e.key === '=') { e.preventDefault(); atlasZoom(atlas.W / 2, atlas.H / 2, 1.2); }
    else if (e.key === '-') { e.preventDefault(); atlasZoom(atlas.W / 2, atlas.H / 2, 1 / 1.2); }
    else if (e.key === '0') { e.preventDefault(); atlasFit(); }
  }
  if (e.key === 'Enter' && document.activeElement && document.activeElement.matches('tr[data-action="open-device"]')) {
    location.hash = '#/device/' + document.activeElement.dataset.id + '/overview';
  }
});

/* --- import config --- */
$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (data.settings) state.settings = Object.assign({}, SETTINGS, data.settings);
      toast('Configuration imported');
      render();
    } catch (err) { toast('Invalid configuration file', 'err'); }
  };
  r.readAsText(f);
  e.target.value = '';
});

/* --- chart hover tooltip --- */
document.addEventListener('mousemove', e => {
  const wrap = e.target.closest ? e.target.closest('#bwChart') : null;
  const tip = $('#bwTip');
  if (!tip) return;
  if (!wrap) { tip.style.display = 'none'; return; }
  const r = wrap.getBoundingClientRect();
  const padL = 38, padR = 8;
  const x = clamp(e.clientX - r.left, padL, r.width - padR);
  const idx = Math.round((x - padL) / (r.width - padL - padR) * (state.series.down.length - 1));
  const dn = state.series.down[idx], up = state.series.up[idx];
  if (dn == null) { tip.style.display = 'none'; return; }
  tip.style.display = 'block';
  tip.textContent = '−' + (60 - idx) + 's · ↓ ' + fmtM(dn) + ' ↑ ' + fmtM(up) + ' Mb/s';
  tip.style.left = clamp(x + 12, 0, r.width - 170) + 'px';
  tip.style.top = '10px';
});

/* --- init --- */
try {
  const saved = localStorage.getItem('netdash-theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
} catch (err) {}
$('#themeBtn').innerHTML = document.documentElement.getAttribute('data-theme') === 'light' ? SUN : MOON;
window.addEventListener('hashchange', route);
window.addEventListener('resize', () => { refreshCharts(); atlasResize(); });
route();
setInterval(tick, 1000);
tick();
</script>
</body>
